rail for data-modifying operations layers **defense in depth**.\n- **Correct (D):** default **read-only credentials**, a subagent tool list limited to read-only operations, and **mandatory human confirmation** before any write -- so even if the model attempts an unintended mutation, the credential and tool scope prevent it and a human gates the exception.\n- Writing directly with no gates, granting a **fully privileged credential** with no confirmation, or disabling logging all remove exactly the **least-privilege controls and observability** that keep a production database safe."},{"id":104,"q":"You are building an evaluation pipeline for a Claude-based deployment and must complete the specification steps before running the deployment against the dataset. Which two steps must be completed BEFORE running the deployment against the evaluation dataset? (Select two.) Each correct answer presents part of the solution.","opts":{"A":"Publish the aggregated metrics to a dashboard and gate releases on threshold checks.","B":"Curate and label the evaluation dataset to match the defined slices.","C":"Review failure cases with subject matter experts to refine the scoring rubric.","D":"Define the metrics and slices the framework will report across representative, edge, and adversarial cases.","E":"Score the deployment outputs against the reference labels and aggregate the metrics."},"ans":["B","D"],"exp":"Evaluation must be **specified before it is executed**, so the two prerequisite steps are:\n- **(D) Define metrics and slices** across representative, edge, and adversarial cases.\n- **(B) Curate and label the dataset** to match those slices.\n- Without a defined measurement target and labeled reference data, there is nothing meaningful to score against. Scoring outputs, publishing dashboards with release gates, and reviewing failures with experts all come **after** the run, so they cannot be prerequisites."},{"id":105,"q":"You are identifying signals that a deployment should re-enter design rather than continue iterating in place. Which signal most directly indicates the need for a new design cycle?","opts":{"A":"A runbook step requires a clarification edit to improve on-call guidance accuracy, which can be handled as a documentation update without changes to component responsibilities or core contracts.","B":"A dashboard alert threshold needs a small numerical adjustment to reduce false-positive noise, which can be handled as an operational configuration change without a new design cycle.","C":"A minor copy edit is requested in a customer-facing string within the existing UI, which can be handled as a localized content change without altering component responsibilities or contracts.","D":"The system's current architecture cannot meet the new requirements without changes to component responsibilities or core contracts."},"ans":["D"],"exp":"A new design cycle is warranted only when the existing architecture **structurally cannot** satisfy new requirements.\n- **Correct (D):** the current architecture cannot meet the new requirements without changing **component responsibilities or core contracts**, signaling the design's boundaries are the limiting factor, not the implementation.\n- A runbook clarification, an alert-threshold tweak, and a customer-facing copy edit are **localized documentation, configuration, or content changes** that leave responsibilities and contracts intact, so they are handled through normal iteration."},{"id":106,"q":"You are rolling out a standardized Claude Code configuration to an engineering team and must complete the planning steps before piloting the configuration. Which two steps must be completed BEFORE piloting the configuration with a small group of engineers? (Select two.) Each correct answer presents part of the solution.","opts":{"A":"Define the project-scope baseline covering Model Context Protocol (MCP) servers, permission rules, and subagents.","B":"Onboard every engineer in the organization to the new configuration through mandatory training sessions.","C":"Roll out the stabilized configuration to additional teams with documentation and a defined support channel.","D":"Identify the team workflows, security boundaries, and which decisions belong to managed configuration versus project scope.","E":"Iterate the configuration based on the pilot findings and stabilize the baseline before broader rollout."},"ans":["A","D"],"exp":"Before piloting, the team must first **understand the context and set the baseline**.\n- **(D) Identify workflows, security boundaries, and managed-vs-project scope:** establishes the requirements and governance model.\n- **(A) Define the project-scope baseline** of MCP servers, permission rules, and subagents: produces the concrete configuration to pilot.\n- Organization-wide onboarding, iterating on pilot findings, and rolling out to additional teams all occur **during or after** the pilot, so they cannot precede it."},{"id":107,"q":"A healthcare organization is evaluating two Claude-powered AI architectures for a clinical documentation assistant. Architecture X produces higher output quality scores but costs $0.18 per documentation session and averages 4.2 seconds per response. Architecture Y scores slightly lower on quality metrics but costs $0.09 per session and averages 2.1 seconds per response. The stated SLA requires responses under 3 seconds, and the annual volume is projected at 2 million documentation sessions. Which evaluation approach correctly applies business value pillar analysis to this decision?","opts":{"A":"Select Architecture Y based solely on the 50% cost reduction, since solution cost is the most important value pillar in healthcare budget-constrained environments.","B":"Select Architecture X because the higher quality scores justify the cost premium, and any SLA gap can be addressed through infrastructure optimization after deployment.","C":"Eliminate Architecture X on SLA grounds, then evaluate Architecture Y against the efficiency and solution cost pillars by calculating annual cost difference and assessing whether the quality delta materially impacts clinical workflow productivity.","D":"Recommend a hybrid approach using Architecture X for complex cases and Architecture Y for routine cases, without additional analysis, since this preserves quality where it matters most."},"ans":["C"],"exp":"Business value pillar analysis applies **hard constraints before weighing trade-offs**.\n- **Correct (C):** Architecture X averages 4.2 seconds and violates the mandatory **sub-3-second SLA**, so it is eliminated as non-compliant regardless of quality. Architecture Y meets the SLA at 2.1 seconds, so the remaining analysis quantifies the **efficiency and cost pillars** -- the annual cost difference over 2 million sessions -- and judges whether the small quality delta materially affects clinical productivity.\n- Choosing on **cost alone**, deferring an SLA gap to post-deployment optimization, or proposing an **unanalyzed hybrid** all skip the disciplined constraint-then-trade-off reasoning."},{"id":108,"q":"You are a solution architect designing a Claude-based assistant with access to 60 internal tools across multiple business domains. Loading every tool definition on every request increases token usage and time to first response. Which design pattern best addresses this issue without sacrificing capability breadth?","opts":{"A":"Apply progressive tool discovery so a curated initial subset is exposed and additional tools are loaded on demand based on the task.","B":"Use a separate model call to summarize all 60 tool definitions before each user turn.","C":"Increase the maximum context length and load all 60 tool definitions on every request, accepting the higher token cost and latency as necessary for full capability.","D":"Hard-code a fixed set of five tools per request to reduce token usage, regardless of whether those tools are relevant to the current task."},"ans":["A"],"exp":"**Progressive tool discovery** exposes a small curated subset of tools up front and loads additional definitions **on demand** as the task requires (**A**), cutting per-request token load and time to first response while keeping all 60 tools reachable.\n- Summarizing every definition each turn adds an extra model call and still processes all tools.\n- Loading all 60 with a bigger context accepts the very cost being solved.\n- Hard-coding five fixed tools sacrifices **capability breadth** by ignoring task relevance."},{"id":109,"q":"You are listing characteristics of robust guardrail design for an enterprise deployment. Which two characteristics belong on the list? (Select two.) Each correct answer presents a complete solution.","opts":{"A":"Centralized log retention for guardrail violations with quarterly review by the security team.","B":"Periodic refresh of the system prompt wording to keep refusal language current and clear.","C":"User feedback channels that route reported guardrail failures into the product backlog for triage.","D":"Per-role tool allow-lists enforced at the orchestration layer before any tool call executes.","E":"Adversarial-input coverage in the evaluation set with regression tracking on guardrail performance."},"ans":["D","E"],"exp":"Robust guardrails need both **preventive enforcement** and **continuous validation**.\n- **(D) Per-role tool allow-lists** enforced at the orchestration layer before any tool call runs: stop unauthorized actions deterministically rather than relying on the model to refuse.\n- **(E) Adversarial-input coverage** in the evaluation set with **regression tracking**: verifies the guardrails actually hold and catches regressions over time.\n- Log retention, refreshing refusal wording, and feedback channels are useful supporting hygiene but are **reactive or cosmetic** and do not by themselves constitute the core enforce-and-verify design."},{"id":110,"q":"You are explaining the precedence of Claude Code configuration scopes to the team. Which precedence ordering, from highest to lowest, is correct?","opts":{"A":"Local > managed > user > command-line arguments > project","B":"Project > user > managed > local > command-line arguments","C":"Managed > command-line arguments > local > project > user","D":"User > project > local > command-line arguments > managed"},"ans":["C"],"exp":"Claude Code resolves configuration by precedence, with **enterprise-managed policy at the top** so administrators can enforce non-overridable settings.\n- **Correct (C):** **Managed > command-line arguments > local > project > user**.\n- **Managed** settings sit highest precisely so organizational controls cannot be undone by lower scopes; **user**-level settings sit lowest as personal defaults.\n- The other orderings misplace managed policy or invert the local/project/user hierarchy, which would let individual or project settings override enterprise policy."},{"id":111,"q":"A Claude architect is leading the discovery phase for a new AI-powered customer service solution. Which two activities are characteristic of structured discovery and requirement gathering for a Claude-based deployment? (Select two.)","opts":{"A":"Facilitating stakeholder workshops to surface latency, accuracy, and compliance constraints before scoping begins.","B":"Selecting the Claude model tier based on the architect's prior project experience before stakeholder input is collected.","C":"Generating an initial prototype and iterating based on user reaction rather than written requirements.","D":"Documenting explicit success criteria and failure thresholds that will gate production deployment.","E":"Deferring constraint documentation until the integration design phase to avoid scope creep."},"ans":["A","D"],"exp":"**Structured discovery** is about eliciting and documenting real requirements before design and model choices are locked in, so **A** and **D** are correct.\n- **A** — Facilitating stakeholder workshops to surface **latency, accuracy, and compliance constraints** grounds scoping in actual operational needs.\n- **D** — Documenting explicit **success criteria and failure thresholds** creates measurable gates for production readiness.\n- **B** is wrong: choosing a model tier from habit before stakeholder input skips discovery entirely.\n- **C** substitutes prototyping for requirement gathering.\n- **E** defers constraint capture, which is exactly the work discovery is meant to do up front."},{"id":112,"type":"match","q":"You are classifying token-management tactics by where each tactic applies in the request lifecycle: \"Input Preparation,\" \"Prompt Construction,\" or \"Output Handling.\"","choices":["Input Preparation","Prompt Construction","Output Handling"],"stmts":[{"s":"Persist the validated output for downstream consumption and audit.","a":"Output Handling"},{"s":"Order the prompt sections so cacheable content sits before per-request content.","a":"Prompt Construction"},{"s":"Summarize prior conversation history when full history is no longer needed.","a":"Input Preparation"},{"s":"Validate the model's structured output against the expected schema.","a":"Output Handling"},{"s":"Move stable repeated content into a cacheable prefix at the head of the prompt.","a":"Prompt Construction"},{"s":"Trim retrieved passages to spans relevant to the user's question.","a":"Input Preparation"}],"exp":"Token-management tactics map to the **request lifecycle stage** where they act.\n- **Output Handling** — Persisting validated output for downstream use and validating structured output against a schema both occur **after generation**.\n- **Prompt Construction** — Ordering sections so cacheable content precedes per-request content and moving stable repeated content into a **cacheable prefix** are both about how the prompt is assembled.\n- **Input Preparation** — Summarizing prior conversation history and trimming retrieved passages to relevant spans both **reduce and shape the material fed in** before prompt assembly."},{"id":113,"q":"A customer support team has proposed delegating customer refund decisions to a Claude-driven workflow with no human review for refunds under 50 USD. The team's reasoning is that small refunds are low-risk and human review would erase the efficiency gain. Which Delegation-competency principle should guide your response?","opts":{"A":"Delegation should always include human review on every decision the workflow produces.","B":"Delegation scope should reflect the type of risk involved, not the transaction size alone.","C":"Delegation scope should be set primarily by maximizing efficiency gains across the workflow.","D":"Delegation should be avoided entirely wherever financial transactions occur in the workflow."},"ans":["B"],"exp":"The correct principle is **B**: delegation scope should be driven by the **type of risk**, not merely the dollar amount.\n- A small refund can still carry **reputational, fraud, compliance, or precedent risk**, so a 50 USD threshold does not by itself make autonomous action safe.\n- **A** is too absolute since not every decision needs human review.\n- **C** wrongly elevates **efficiency** over risk assessment.\n- **D** over-corrects by banning delegation for all financial actions, discarding legitimate automation opportunities."},{"id":114,"q":"You are identifying inefficiency in a Claude Code workflow where each engineer manually re-explains the project's conventions and architecture in every session. Which adjustment most directly removes this inefficiency?","opts":{"A":"Forbid the use of Claude Code on the project entirely to avoid the session-initialization overhead, accepting that the team loses all AI-assisted development productivity for this codebase.","B":"Capture the project's conventions and architecture in a project-scoped CLAUDE.md (or equivalent persistent project-context file) committed to the repository, so each session loads it automatically.","C":"Tell each engineer to retype the project conventions and architecture context more quickly at the start of each session, reducing time lost without eliminating the repeated manual effort.","D":"Remove all documented project conventions and architectural standards so engineers have nothing to re-explain at session start, accepting the loss of consistency and shared coding standards."},"ans":["B"],"exp":"The inefficiency is **repeated manual re-explanation** of project context every session, and **B** removes it at the source.\n- **B** — Capturing conventions and architecture in a committed, project-scoped **CLAUDE.md** lets Claude Code load it automatically each session.\n- **A** abandons the tool and all its productivity.\n- **C** only makes the wasteful repetition faster rather than eliminating it.\n- **D** destroys the very standards the team needs.\n- Persistent project-context files exist precisely so **shared knowledge is loaded once and reused**."},{"id":115,"q":"The compliance team has authored a regulatory disclosure procedure that must be applied identically across customer service, sales, and onboarding workflows. The procedure changes when regulators issue updates, currently four to six times per year. You are designing how the procedure will be packaged for use by Claude across all three workflows. Which two design decisions should you include? (Select two.) Each correct answer presents part of the solution.","opts":{"A":"Package the procedure as a Claude Skill owned directly by the compliance team.","B":"Embed the procedure text into each workflow's system prompt at integration time.","C":"Store the procedure in a shared retrieval corpus accessed by all three workflows.","D":"Have each workflow team rewrite the procedure for its own context.","E":"Reference the same Claude Skill from all three workflow integrations."},"ans":["A","E"],"exp":"Because the disclosure procedure must be **identical** across three workflows and updates several times a year, the right design centralizes it as a **single authoritative artifact with one owner**, so **A** and **E** are correct.\n- **A** — Packaging it as a **Claude Skill owned by the compliance team** puts maintenance with the domain authority.\n- **E** — Referencing that same Skill from all three integrations guarantees every workflow uses the current version after a **single update**.\n- **B** and **D** create divergent copies that **drift out of sync** on every regulatory change.\n- **C** treats a prescriptive procedure as retrievable reference material, which does not guarantee consistent, mandatory application."},{"id":116,"q":"You are compiling continuity practices that span the deployment lifecycle. Which two practices belong on the list? (Select two.) Each correct answer presents a complete solution.","opts":{"A":"Maintain a stakeholder register and notify the listed parties at every phase transition event.","B":"Carry the evaluation framework and reference set forward across iterations rather than rebuilding each time.","C":"Archive every phase deliverable in long-term storage to preserve a record of what was produced.","D":"Capture lessons learned at the end of each phase and surface them as inputs to the next phase.","E":"Lock decisions made in early phases to prevent revisiting them as later phases begin."},"ans":["B","D"],"exp":"**Continuity practices** carry knowledge and assets forward across phases rather than treating each phase in isolation, so **B** and **D** are correct.\n- **B** — Carrying the **evaluation framework and reference set** forward avoids rebuilding measurement infrastructure and keeps results comparable across iterations.\n- **D** — Capturing **lessons learned** as inputs to the next phase feeds improvement through the lifecycle.\n- **A** and **C** are administrative record-keeping rather than continuity of substance.\n- **E** is actively harmful: locking early decisions prevents the healthy revisiting that new information should trigger."}];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const el = (t,c,x) => { const n=document.createElement(t); if(c)n.className=c; if(x!==undefined)n.textContent=x; return n; };
const setOf = id => id<=20?1:id<=40?2:id<=60?3:id<=80?4:id<=100?5:6;
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const KEY='ccarp_wrong_v1';
const store = {
  get(){ try{ return JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ return mem; } },
  set(v){ mem=v; try{ localStorage.setItem(KEY,JSON.stringify(v)); }catch(e){} }
};
let mem=[];

/* ---------- setup state ---------- */
const state = { mode:'practice', scope:'all', count:0, shuffle:true };

function chipGroup(sel, key, after){
  $(sel).addEventListener('click', e=>{
    const b=e.target.closest('.chip'); if(!b) return;
    [...$(sel).querySelectorAll('.chip')].forEach(c=>c.setAttribute('aria-pressed', c===b));
    let v=b.dataset.v; if(key==='count') v=+v;
    state[key]=v; if(after) after();
  });
}
chipGroup('#modeChips','mode',()=>{
  $('#modeHint').textContent = state.mode==='practice'
    ? 'Kiểm tra và xem đáp án ngay sau mỗi câu.'
    : 'Làm hết rồi mới chấm điểm, giống thi thật.';
});
chipGroup('#setChips','scope',updateScopeHint);
chipGroup('#countChips','count');
$('#shuffleQ').addEventListener('change', e=>state.shuffle=e.target.checked);

function pool(){
  if(state.scope==='all') return QUESTIONS.slice();
  if(state.scope==='wrong'){ const w=store.get(); return QUESTIONS.filter(q=>w.includes(q.id)); }
  return QUESTIONS.filter(q=>setOf(q.id)===+state.scope);
}
function updateScopeHint(){
  const n=pool().length;
  $('#scopeHint').textContent = state.scope==='wrong'
    ? (n? n+' câu bạn từng trả lời sai.' : 'Chưa có câu sai nào được lưu.')
    : n+' câu trong phạm vi này.';
}
updateScopeHint();

$('#clearBtn').addEventListener('click', ()=>{ store.set([]); updateScopeHint(); $('#clearBtn').textContent='Đã xoá'; setTimeout(()=>$('#clearBtn').textContent='Xoá lịch sử câu sai',1400); });

/* ---------- run state ---------- */
let run=null;

$('#startBtn').addEventListener('click', ()=>{
  let qs=pool();
  if(!qs.length){ alert('Phạm vi này chưa có câu nào.'); return; }
  if(state.shuffle) shuffle(qs); else qs.sort((a,b)=>a.id-b.id);
  if(state.count>0) qs=qs.slice(0,state.count);
  run={ qs, i:0, answers:new Array(qs.length).fill(null), results:new Array(qs.length).fill(null), locked:false };
  $('#setup').classList.add('hide'); $('#result').classList.add('hide'); $('#quiz').classList.remove('hide');
  render();
});
$('#quitBtn').addEventListener('click', ()=>{ if(confirm('Dừng và quay lại màn hình chọn?')){ $('#quiz').classList.add('hide'); $('#setup').classList.remove('hide'); updateScopeHint(); }});
$('#againBtn').addEventListener('click', ()=>{ $('#result').classList.add('hide'); $('#setup').classList.remove('hide'); updateScopeHint(); });
$('#wrongBtn').addEventListener('click', ()=>{
  state.scope='wrong';
  [...$('#setChips').querySelectorAll('.chip')].forEach(c=>c.setAttribute('aria-pressed', c.dataset.v==='wrong'));
  updateScopeHint(); $('#result').classList.add('hide'); $('#setup').classList.remove('hide');
});

/* ---------- render ---------- */
function render(){
  const q=run.qs[run.i];
  run.locked=false;
  $('#barFill').style.width = (run.i/run.qs.length*100)+'%';
  $('#qPos').textContent = 'Câu '+(run.i+1)+' / '+run.qs.length;
  $('#qTag').textContent = 'Set '+setOf(q.id)+' · #'+q.id;
  $('#qText').textContent = q.q;
  $('#verdict').className='verdict hide';
  $('#explain').className='explain hide'; $('#explain').innerHTML='';
  $('#checkBtn').classList.remove('hide'); $('#nextBtn').classList.add('hide');
  $('#checkBtn').textContent = state.mode==='exam' ? 'Xác nhận' : 'Kiểm tra';

  const note=$('#qNote');
  if(q.type==='yesno'){ note.textContent='Chọn Yes hoặc No cho từng phát biểu'; note.classList.remove('hide'); }
  else if(q.type==='match'){ note.textContent='Chọn nhóm phù hợp cho từng mục'; note.classList.remove('hide'); }
  else if(q.ans.length>1){ note.textContent='Chọn '+q.ans.length+' đáp án'; note.classList.remove('hide'); }
  else note.classList.add('hide');

  const body=$('#qBody'); body.innerHTML='';
  const prev=run.answers[run.i];

  if(q.type==='yesno'||q.type==='match'){
    const box=el('div','opts');
    q.stmts.forEach((st,idx)=>{
      const row=el('div','srow'); row.dataset.idx=idx;
      row.appendChild(el('div','s',st.s));
      if(q.type==='yesno'){
        const g=el('div','yn');
        ['Yes','No'].forEach(v=>{
          const b=el('button',null,v); b.type='button';
          b.setAttribute('aria-pressed', prev && prev[idx]===v);
          b.addEventListener('click',()=>{
            if(run.locked) return;
            [...g.children].forEach(c=>c.setAttribute('aria-pressed','false'));
            b.setAttribute('aria-pressed','true');
            const a=run.answers[run.i]||new Array(q.stmts.length).fill(null);
            a[idx]=v; run.answers[run.i]=a;
          });
          g.appendChild(b);
        });
        row.appendChild(g);
      } else {
        const s=el('select');
        s.appendChild(new Option('— chọn —',''));
        q.choices.forEach(c=>s.appendChild(new Option(c,c)));
        if(prev && prev[idx]) s.value=prev[idx];
        s.addEventListener('change',()=>{
          const a=run.answers[run.i]||new Array(q.stmts.length).fill(null);
          a[idx]=s.value||null; run.answers[run.i]=a;
        });
        row.appendChild(s);
      }
      box.appendChild(row);
    });
    body.appendChild(box);
  } else {
    const multi=q.ans.length>1;
    const box=el('div','opts');
    Object.keys(q.opts).forEach(k=>{
      const lab=el('label','opt'); lab.dataset.k=k;
      const inp=document.createElement('input');
      inp.type = multi?'checkbox':'radio'; inp.name='opt'; inp.value=k;
      if(prev && prev.includes(k)){ inp.checked=true; lab.classList.add('sel'); }
      inp.addEventListener('change',()=>{
        if(run.locked){ inp.checked=!inp.checked; return; }
        const picked=[...box.querySelectorAll('input')].filter(x=>x.checked).map(x=>x.value);
        run.answers[run.i]=picked;
        [...box.querySelectorAll('.opt')].forEach(o=>o.classList.toggle('sel', picked.includes(o.dataset.k)));
      });
      lab.appendChild(inp);
      lab.appendChild(el('span','k',k+'.'));
      lab.appendChild(el('span','t',q.opts[k]));
      box.appendChild(lab);
    });
    body.appendChild(box);
  }
}

function isCorrect(q,a){
  if(!a) return false;
  if(q.type==='yesno'||q.type==='match') return q.stmts.every((st,i)=>a[i]===st.a);
  return a.length===q.ans.length && q.ans.every(k=>a.includes(k));
}

$('#checkBtn').addEventListener('click', ()=>{
  const q=run.qs[run.i], a=run.answers[run.i];
  const answered = a && (q.type==='yesno'||q.type==='match' ? a.every(x=>x) : a.length>0);
  if(!answered){ alert('Bạn chưa chọn đáp án.'); return; }
  const ok=isCorrect(q,a);
  run.results[run.i]=ok;
  if(!ok){ const w=store.get(); if(!w.includes(q.id)){ w.push(q.id); store.set(w); } }

  if(state.mode==='practice'){
    run.locked=true;
    reveal(q,a,ok);
    $('#checkBtn').classList.add('hide'); $('#nextBtn').classList.remove('hide');
    $('#nextBtn').textContent = run.i===run.qs.length-1 ? 'Xem kết quả' : 'Câu tiếp';
    $('#nextBtn').focus();
  } else {
    advance();
  }
});
$('#nextBtn').addEventListener('click', advance);

function advance(){
  if(run.i===run.qs.length-1){ finish(); return; }
  run.i++; render(); window.scrollTo({top:0,behavior:'smooth'});
}

function reveal(q,a,ok){
  if(q.type==='yesno'||q.type==='match'){
    [...$('#qBody').querySelectorAll('.srow')].forEach((row,i)=>{
      const good = a[i]===q.stmts[i].a;
      row.classList.add(good?'ok':'bad');
      if(!good){ const t=el('div','truth miss','Đúng: '+q.stmts[i].a); row.appendChild(t); }
      row.querySelectorAll('select,button').forEach(c=>c.disabled=true);
    });
  } else {
    [...$('#qBody').querySelectorAll('.opt')].forEach(o=>{
      const k=o.dataset.k;
      o.classList.add('locked'); o.classList.remove('sel');
      if(q.ans.includes(k)) o.classList.add('ok');
      else if(a.includes(k)) o.classList.add('bad');
    });
  }
  const v=$('#verdict');
  v.className='verdict '+(ok?'ok':'bad');
  v.textContent = ok ? 'Chính xác.' : 'Chưa đúng — đáp án đúng được tô xanh.';

  if(q.exp){
    const ex=$('#explain');
    ex.className='explain';
    ex.innerHTML='';
    ex.appendChild(el('span','eh','Why'));
    const body=document.createElement('div');
    body.innerHTML=renderExp(q.exp);
    ex.appendChild(body);
  }
}

/* render lightweight markdown (bold + bullet lists) safely */
function renderExp(md){
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const inline = s => esc(s).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  const lines = String(md).split('\n').map(l=>l.trim()).filter(Boolean);
  let html='', inList=false;
  for(const ln of lines){
    if(/^[-•]\s+/.test(ln)){
      if(!inList){ html+='<ul>'; inList=true; }
      html+='<li>'+inline(ln.replace(/^[-•]\s+/,''))+'</li>';
    } else {
      if(inList){ html+='</ul>'; inList=false; }
      html+='<p>'+inline(ln)+'</p>';
    }
  }
  if(inList) html+='</ul>';
  return html;
}

function finish(){
  $('#barFill').style.width='100%';
  const total=run.qs.length, right=run.results.filter(Boolean).length;
  const pct=Math.round(right/total*100);
  $('#quiz').classList.add('hide'); $('#result').classList.remove('hide');
  $('#scoreNum').innerHTML = right+' / '+total+' <small>· '+pct+'%</small>';
  $('#scoreLine').textContent = pct>=80 ? 'Đủ tự tin cho phần này.' : pct>=60 ? 'Gần tới rồi, ôn lại các câu sai.' : 'Nên ôn lại toàn bộ phạm vi này.';
  const list=$('#reviewList'); list.innerHTML='';
  run.qs.forEach((q,i)=>{
    const ok=run.results[i];
    const it=el('div','ritem');
    it.appendChild(el('span','n','#'+q.id));
    it.appendChild(el('span','st '+(ok?'ok':'bad'), ok?'Đúng':'Sai'));
    const txt=el('span','x', q.q.length>120 ? q.q.slice(0,120)+'…' : q.q);
    it.appendChild(txt);
    list.appendChild(it);
  });
  window.scrollTo({top:0,behavior:'smooth'});
}

/* keyboard */
document.addEventListener('keydown', e=>{
  if($('#quiz').classList.contains('hide')) return;
  if(e.key==='Enter'){ e.preventDefault(); (run.locked?$('#nextBtn'):$('#checkBtn')).click(); return; }
  const q=run.qs[run.i];
  if(q.type==='yesno'||q.type==='match'||run.locked) return;
  const keys=Object.keys(q.opts);
  const n=parseInt(e.key,10);
  if(n>=1&&n<=keys.length){
    const inp=$('#qBody').querySelectorAll('input')[n-1];
    inp.checked = q.ans.length>1 ? !inp.checked : true;
    inp.dispatchEvent(new Event('change'));
  }
});

$('#topSub').textContent = QUESTIONS.length+' câu hỏi · 6 practice set';
</script>
