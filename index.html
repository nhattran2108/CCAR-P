s":["C"],"exp":"To keep generated documentation grounded in the actual implementation, subagents must read the real code via filesystem and code-search tools, then emit changes through the team's normal review workflow (C), which combines factual grounding with human oversight. Generating from training-data recall (A) or disabling code-reading tools (D) disconnects the output from the current code and invites inaccuracy. Publishing directly to a public site with no review (B) removes the human approval step and risks shipping errors, so it fails the grounding-plus-governance requirement."},{"id":49,"type":"yesno","q":"You are reviewing a peer's end-to-end design for a Claude-based platform expected to scale to thousands of concurrent users. For each statement, indicate Yes if it reflects sound architectural practice. Otherwise, select No.","stmts":[{"s":"Authentication and authorization run before retrieval so retrieval can filter by identity.","a":"Yes"},{"s":"An asynchronous queue absorbs bursty traffic between intake and the model invocation layer.","a":"Yes"},{"s":"Tax computation is encoded directly in the system prompt rather than in code.","a":"No"},{"s":"Conversation logs include unredacted government identifiers to maximize signal for tuning.","a":"No"}],"exp":"Running authentication and authorization before retrieval is sound (Yes) because identity must be known so retrieval can filter results to what the user is permitted to see, preventing data leakage. An asynchronous queue between intake and model invocation is sound (Yes) because it absorbs bursty traffic and smooths load across the model layer at scale. Encoding tax computation in the system prompt is unsound (No) because deterministic calculations belong in tested, auditable code rather than probabilistic generation. Logging unredacted government identifiers is unsound (No) because it violates data-minimization and privacy principles regardless of any tuning benefit."},{"id":50,"q":"You are presenting an architectural decision to a mixed audience that includes an executive sponsor and the engineering leads who will implement the decision. Which presentation strategy best serves both audiences?","opts":{"A":"Open with a deep dive into low-level implementation details targeted at engineering leads, and stop there without addressing the business outcomes or trade-offs the executive sponsor needs.","B":"Lead with the decision, the business outcomes it serves, and the trade-offs accepted; follow with the technical rationale, alternatives, and implementation implications for the engineering audience.","C":"Skip the rationale, alternatives, and trade-off discussion entirely and simply announce the chosen decision, leaving both audiences without the context needed to implement or validate it.","D":"Present a single undifferentiated narrative that addresses technical and business concerns with equal weight throughout, treating both audiences as requiring the same depth on every section."},"ans":["B"],"exp":"A mixed audience is best served by layering the message: lead with the decision, the business outcomes it serves, and the trade-offs accepted for the executive sponsor, then follow with technical rationale, alternatives, and implementation implications for the engineering leads (B). Opening with low-level details (A) loses the executive and omits business framing, while simply announcing the decision with no rationale (C) leaves everyone unable to validate or implement it. A single undifferentiated narrative (D) fails to match depth to each audience's needs and wastes attention."},{"id":51,"q":"You are selecting a pattern for a compliance Q&A assistant that must answer policy questions with citations to the authoritative internal source set. Latency, cost, and audit predictability are prioritized. Which pattern is the best fit?","opts":{"A":"Augmented LLM with retrieval-augmented generation over the indexed authoritative corpus and citation rendering on each answer.","B":"Multi-agent orchestration with a planner, researcher, and writer agent for every query.","C":"A pure agent loop with open web-browsing tools to surface the most current policy information, without constraining retrieval to the authoritative internal corpus.","D":"A static prompt with the entire policy corpus concatenated into every request."},"ans":["A"],"exp":"A retrieval-augmented augmented LLM constrained to the authoritative internal corpus with per-answer citations is the right fit because it keeps answers grounded in the approved source set, produces auditable references, and adds only a single retrieval step so latency and cost stay predictable. Multi-agent orchestration (B) adds latency, cost, and non-determinism that undermine audit predictability for a bounded Q&A task. An open web-browsing agent loop (C) breaks the requirement to cite only authoritative internal sources, and concatenating the whole corpus into every request (D) is expensive, hits context limits, and dilutes relevance without giving targeted citations."},{"id":52,"q":"You are a platform architect designing an internal Claude-based assistant that serves both finance analysts and external auditors. Each population must access only documents permitted by its role. Where should role-based access control be enforced in the pipeline?","opts":{"A":"Inside the system prompt as a natural-language instruction for Claude to ignore unauthorized documents.","B":"At the retrieval layer, before any role-restricted content reaches the prompt-construction step or the model.","C":"Nowhere in the pipeline; rely on the model's general refusal behavior to reject unauthorized document access without any enforced access control.","D":"After the response is generated, by post-filtering content that should not have been retrieved."},"ans":["B"],"exp":"Role-based access control must be enforced at the retrieval layer so that content a role may not see is never fetched into the prompt or exposed to the model. Relying on a natural-language system-prompt instruction (A) or the model's general refusal behavior (C) is not a real access control because the model can be manipulated or can leak restricted text once it is in context. Post-filtering after generation (D) is unsafe because the unauthorized data has already entered the prompt and could influence or appear in the output; enforcement must happen before prompt construction."},{"id":53,"q":"You are designing a content moderation classifier that processes high volumes of user-generated comments under a tight per-message latency budget using well-defined classification labels. Which model selection best aligns with the workload?","opts":{"A":"Opus, because every moderation decision requires maximum reasoning depth regardless of classification complexity.","B":"Haiku, because its latency and cost profile align with high-volume classification workloads that require limited reasoning depth.","C":"Sonnet, because larger general-purpose models are preferred even when workload latency requirements are strict.","D":"Sonnet with extended thinking enabled, because deeper reasoning should be applied to every moderation request to improve edge-case handling."},"ans":["B"],"exp":"Haiku matches high-volume, latency-sensitive classification against well-defined labels because such work needs limited reasoning depth and benefits most from low cost and fast responses. Opus (A) applies maximum reasoning to every message, wasting cost and latency on simple decisions. Choosing Sonnet by default (C) or Sonnet with extended thinking on every request (D) ignores the strict per-message latency budget; extended thinking in particular adds token and time overhead that is unjustified for routine, clearly-defined moderation labels."},{"id":54,"q":"A Claude architect is implementing safety controls for a customer-facing advice assistant that must never provide regulated investment recommendations. Which two guardrail implementations most directly enforce this constraint? (Select two.)","opts":{"A":"Increase response temperature to introduce variability that reduces the likelihood of specific recommendations.","B":"Add an output classifier that detects and blocks responses containing regulated investment-recommendation language.","C":"Limit session length to reduce the volume of queries processed per user per day.","D":"Log all user queries to a SIEM for post-hoc compliance review.","E":"Define explicit out-of-scope categories in the system prompt with fixed refusal phrasing for investment advice requests."},"ans":["B","E"],"exp":"The two controls that directly enforce a no-investment-advice rule are an output classifier (B) that detects and blocks regulated-recommendation language before it reaches the user, and explicit out-of-scope definitions with fixed refusal phrasing in the system prompt (E) that steer the model to decline such requests. Raising temperature (A) increases variability and makes behavior less controllable, not safer. Limiting session length (C) and logging queries to a SIEM (D) are operational or after-the-fact measures that do not prevent a prohibited recommendation from being produced and shown in a single response."},{"id":55,"q":"You are responding to a stakeholder request that adds significant scope to a deployment already in flight. Which response best aligns expectations while respecting the stakeholder's underlying need?","opts":{"A":"Hide the scope-addition request from the broader delivery team to avoid a difficult conversation, allowing the change to proceed without team awareness of its timeline implications.","B":"Decline the request outright without acknowledging the stakeholder's underlying need or offering alternatives such as deferral, descoping, or timeline extension.","C":"Acknowledge the request, describe the scope and timeline implications transparently, and propose options — defer it, descope something else, or extend the timeline — for the stakeholder to choose.","D":"Accept the additional scope into the current release without describing the timeline or descoping implications, allowing the delivery plan to absorb unacknowledged changes until they surface as delays."},"ans":["C"],"exp":"The best response acknowledges the request, transparently states its scope and timeline implications, and offers concrete tradeoff options such as deferring, descoping something else, or extending the timeline for the stakeholder to choose (C). This respects the underlying need while keeping expectations and delivery realistic. Hiding the request (A), flatly declining without alternatives (B), or silently absorbing the scope until it surfaces as delays (D) all damage trust, transparency, or the delivery plan."},{"id":56,"q":"You are assessing data-exfiltration risk in a Claude-based assistant that has tools for both internal-document retrieval and outbound HTTP calls. Which scenario most directly indicates a data-exfiltration risk?","opts":{"A":"The outbound HTTP tool returns a 200 response when the assistant calls an allow-listed domain to fulfil a user-initiated data-lookup request.","B":"The user submits a routine question and receives a routine answer.","C":"Adversarial content in a retrieved document instructs the model to call the outbound HTTP tool and send sensitive content to an attacker-controlled URL.","D":"The internal-document retrieval tool returns a document that the user is authorized to view."},"ans":["C"],"exp":"The clearest exfiltration risk is adversarial content in a retrieved document instructing the model to invoke the outbound HTTP tool and send sensitive data to an attacker-controlled URL (C); this is an indirect prompt-injection attack chaining an untrusted input to a sensitive outbound action. The other options describe normal, authorized behavior: an allow-listed outbound call for a user-initiated lookup (A), a routine question and answer (B), and retrieval of a document the user is permitted to view (D) none of which involve untrusted instructions driving data to an unauthorized destination."},{"id":57,"q":"You are building an ethics-review checklist for deployments supported by artificial intelligence. Which two checks belong on the list? (Select two.) Each correct answer presents a complete solution.","opts":{"A":"Confirm that vendor licensing terms permit the planned production use of the model.","B":"Verify that outputs do not rely on generalizations about people that the underlying data does not support.","C":"Confirm that high-impact decisions retain human accountability rather than being attributed to the model.","D":"Restrict ethics review to outputs that exceed a defined model-confidence threshold.","E":"Confirm that latency and throughput targets are met across supported user populations."},"ans":["B","C"],"exp":"An ethics-review checklist should verify that outputs do not rely on unsupported generalizations about people (B), guarding against bias and unfounded inferences, and that high-impact decisions retain human accountability rather than being attributed to the model (C), preserving meaningful human oversight. Vendor licensing (A) is a legal/procurement concern and latency/throughput (E) is a performance concern, neither of which is an ethics check. Restricting ethics review only to high-confidence outputs (D) is backwards, since low-confidence and edge cases often carry the greatest ethical risk."},{"id":58,"q":"You are listing characteristics of robust guardrail design for an enterprise deployment. Which two characteristics belong on the list? (Select two.) Each correct answer presents a complete solution.","opts":{"A":"Centralized log retention for guardrail violations with quarterly review by the security team.","B":"Per-role tool allow-lists enforced at the orchestration layer before any tool call executes.","C":"User feedback channels that route reported guardrail failures into the product backlog for triage.","D":"Periodic refresh of the system prompt wording to keep refusal language current and clear.","E":"Adversarial-input coverage in the evaluation set with regression tracking on guardrail performance."},"ans":["B","E"],"exp":"Robust guardrail design includes per-role tool allow-lists enforced at the orchestration layer before any tool executes (B), which deterministically prevents unauthorized actions, and adversarial-input coverage in the evaluation set with regression tracking (E), which ensures guardrails are tested against attacks and stay effective over time. Log retention with quarterly review (A), user feedback channels (C), and refreshing prompt wording (D) are useful supporting practices but are reactive or cosmetic; they do not by themselves enforce or continuously validate the guardrail the way pre-execution enforcement and adversarial regression testing do."},{"id":59,"q":"You are integrating human review into a high-volume classification pipeline where reviewing every output is infeasible. Which sampling strategy best balances throughput with quality oversight?","opts":{"A":"No sampling, relying entirely on user complaints to reveal quality and safety problems after they affect users.","B":"Risk-stratified sampling that reviews all low-confidence and high-impact outputs and a smaller random sample of high-confidence routine outputs.","C":"Inverse sampling that reviews only high-confidence routine outputs and skips low-confidence and high-impact outputs.","D":"Universal review of every output regardless of confidence or throughput impact."},"ans":["B"],"exp":"Risk-stratified sampling that reviews all low-confidence and high-impact outputs plus a smaller random sample of high-confidence routine ones (B) concentrates scarce human attention where errors are most likely or most costly while still monitoring the routine tier. Relying on user complaints (A) catches problems only after harm. Inverse sampling (C) reviews exactly the wrong cases, skipping the risky ones. Universal review (D) defeats the purpose in a high-volume pipeline where reviewing everything is infeasible."},{"id":60,"q":"A business sponsor has requested an AI solution to \"improve customer experience.\" The sponsor cannot articulate which customer journey is failing, which metric reflects the failure, or which decisions the AI should support. The sponsor is asking you to begin design work next week. Which delegation-competency action should you take first?","opts":{"A":"Recommend that the sponsor revise the request and resubmit it later for evaluation.","B":"Begin prototyping a generic assistant against the broad request before the next deadline.","C":"Propose a fixed scope that you commit to by default based on your own assumptions.","D":"Facilitate a structured discovery to define the failing decision and the target metric."},"ans":["D"],"exp":"When a sponsor cannot name the failing journey, the metric, or the decision the AI should support, the first action is to facilitate a structured discovery to define the failing decision and target metric (D); building anything before the problem is framed risks solving the wrong thing. Prototyping a generic assistant (B) or committing to an assumed fixed scope (C) proceeds without a validated problem definition, and simply telling the sponsor to resubmit later (A) abdicates the delegation responsibility to help clarify the need collaboratively."},{"id":61,"q":"A loan pre-qualification assistant shows 94 percent approval recommendations that match the human underwriter decision. The fairness team has reviewed approval rate parity across protected groups and reported no significant difference. A board member has asked whether this evidence is sufficient to declare the assistant fair. Which two Discernment-competency findings should you report? (Select two.) Each correct answer presents part of the solution.","opts":{"A":"Approval rate parity does not by itself assess error rate parity across protected groups.","B":"Match with human underwriters does not establish freedom from underwriter-introduced bias.","C":"The 94 percent match rate is sufficient evidence of fairness for the assistant's decisions.","D":"The fairness team's review process likely missed at least some of the protected groups studied.","E":"A larger sample is needed before any meaningful fairness claim can be made about the model."},"ans":["A","B"],"exp":"Fairness cannot be established from approval-rate parity and agreement with humans alone. Approval-rate parity checks whether groups are approved at similar rates, but it says nothing about error-rate parity, so a model could equalize approvals while making disproportionate false rejections or false approvals for one group (A). Matching human underwriters 94 percent of the time only shows the model reproduces underwriter decisions, and if those historical decisions carried bias the model faithfully inherits it rather than being cleared of it (B). Option C is wrong because a high match rate is agreement, not fairness; D and E introduce assumptions about missed groups or sample size that the scenario does not support."},{"id":62,"q":"You are operating an interactive assistant whose dominant performance constraint is per-turn latency. Quality on routine turns is already acceptable. Which configuration adjustment most directly improves latency without disproportionately damaging quality?","opts":{"A":"Disable prompt caching entirely to ensure fresh context processing on every request, preventing stale prefix content from affecting latency-sensitive interactions.","B":"Reduce retrieval depth to the top-k passages that historically cover the answer, and cache stable system-prompt content.","C":"Increase retrieval depth to the corpus maximum to improve recall regardless of latency.","D":"Switch every turn to the heaviest available model to maximize output quality, accepting that the increased model latency will worsen the per-turn SLO rather than improve it."},"ans":["B"],"exp":"When per-turn latency is the binding constraint and routine quality is already acceptable, the goal is to cut work that does not add value. Reducing retrieval to the top-k passages that historically cover the answer trims the tokens the model must process, and caching stable system-prompt content lets that prefix be reused so it is not reprocessed each turn, both directly lowering latency with little quality loss (B). Disabling prompt caching (A) removes a latency win, increasing retrieval to the maximum (C) adds latency for marginal recall, and always using the heaviest model (D) worsens the latency SLO."},{"id":63,"q":"You are building a feedback-and-alignment routine for a multi-stakeholder deployment. Which two practices belong in the routine? (Select two.) Each correct answer presents a complete solution.","opts":{"A":"Record each session and distribute the recording to stakeholders who could not attend live.","B":"Escalate any disagreement among stakeholders to the executive sponsor for binding resolution.","C":"Rotate facilitation among the participating stakeholder groups to share ownership of the routine.","D":"Set a regular cadence for revisiting expectations and assumptions as conditions evolve over time.","E":"Reconcile divergent stakeholder positions explicitly rather than papering over them in the moment."},"ans":["D","E"],"exp":"A durable alignment routine for many stakeholders needs mechanisms that keep shared understanding accurate over time and resolve genuine disagreement. Setting a regular cadence to revisit expectations and assumptions ensures the agreement stays valid as conditions change rather than drifting silently (D). Explicitly reconciling divergent positions surfaces and resolves conflict instead of leaving hidden disagreements that resurface later as misalignment (E). Recording sessions (A) and rotating facilitation (C) are logistics that do not by themselves create alignment, and automatically escalating every disagreement to an executive (B) undermines stakeholder ownership and healthy negotiation."},{"id":64,"q":"An architect is reviewing a set of architecture documentation packages before handing off a Claude-based pipeline to an implementation team. Which two characteristics indicate that a documentation package is sufficient to support implementation without ongoing architect involvement? (Select two.)","opts":{"A":"The document specifies integration contracts, configuration schemas, and expected input/output shapes for each component.","B":"The document includes a decision log that records the rationale for key architectural choices and the alternatives rejected.","C":"The document provides a high-level narrative description of the business problem without component-level detail.","D":"The document includes the architect's contact information for questions arising during implementation.","E":"The document lists all Claude models that were evaluated but does not specify which was selected or why."},"ans":["A","B"],"exp":"A handoff package is self-sufficient when it lets implementers build and make decisions without asking the architect. Specifying integration contracts, configuration schemas, and expected input/output shapes gives the team the concrete interfaces needed to implement each component correctly (A). A decision log capturing rationale and rejected alternatives lets implementers understand constraints and avoid re-litigating or accidentally undoing key choices (B). A high-level narrative without component detail (C) is insufficient to build from, listing the architect's contact info (D) signals ongoing dependence rather than sufficiency, and naming evaluated models without stating the selection or reasoning (E) leaves a critical decision unresolved."},{"id":65,"q":"You are reviewing a peer's draft system prompt that contains contradictory instructions: one section says never to speculate beyond the supplied source, while another says to confidently fill in any gaps. Which response is most appropriate?","opts":{"A":"Add a priority instruction directing the model to evaluate all instructions and apply whichever appears most contextually appropriate on each request.","B":"Remove or rewrite the gap-filling instruction so the prompt consistently constrains the model to source-supported content.","C":"Increase temperature so output randomness masks the contradiction.","D":"Keep both instructions and rely on the model to decide which one to follow on each request."},"ans":["B"],"exp":"Two directly contradictory instructions cannot both be satisfied, and leaving the conflict in place produces unpredictable behavior because the model has no principled way to reconcile them. The correct fix is to remove or rewrite the gap-filling instruction so the prompt consistently constrains the model to source-supported content, eliminating the contradiction at its root (B). Adding a meta-instruction to pick whichever seems appropriate (A) or relying on the model to choose per request (D) preserves the ambiguity, and raising temperature (C) increases randomness rather than resolving anything."},{"id":66,"q":"You are comparing patterns for a batch document-classification job that follows fixed steps: extract metadata, classify, summarize, and persist. Which pattern is the best fit and why?","opts":{"A":"A workflow pattern, because agentic patterns do not support tool invocations and therefore cannot execute the persist step that writes results to the downstream store.","B":"An agentic pattern, because the open-ended planning capability of agents produces more consistent structured outputs than a fixed workflow graph on classification tasks.","C":"An agentic pattern, because agents are categorically more accurate than workflows and therefore always preferable regardless of step predictability.","D":"A workflow pattern, because the steps are well-defined and predictable per-request token cost is preferred over flexibility."},"ans":["D"],"exp":"The job has a fixed, predictable sequence of steps, which is the defining case for a workflow rather than an agent. A workflow pattern is the best fit because the steps are well-defined and predictable, giving deterministic, lower-cost, and more controllable execution than open-ended agentic planning (D). Option A is factually wrong because workflows can invoke tools, and B and C overstate agents, which are not categorically more accurate or more consistent for structured, predictable pipelines; open-ended planning adds unnecessary variability and cost here."},{"id":67,"q":"A managed agent deployment for claims triage has grown from 6 tools to 34 tools over 18 months as product teams added capabilities. Triage accuracy has declined from 91 percent to 78 percent, and average tool-selection latency has increased by 2.3 seconds. A junior engineer has proposed adding a tool-router agent in front of the current agent to filter the tool list per request. Which two findings should you present to justify capability decomposition before adding the router? (Select two.) Each correct answer presents part of the solution.","opts":{"A":"Tool descriptions overlap across multiple claim categories within the agent's tool set.","B":"Several tools have not been invoked across the most recent 90 days of traffic.","C":"The 34 tools serve four distinct claim-workflow domains within the triage scope.","D":"The router pattern is well documented across publicly available agent literature.","E":"The proposed router introduces an additional model call on every incoming request."},"ans":["C","E"],"exp":"The decline in accuracy and rise in tool-selection latency point to an overloaded, unfocused tool surface, which is what decomposition addresses. The fact that the 34 tools serve four distinct claim-workflow domains shows the agent's scope has fragmented and should be split into focused agents per domain, directly motivating decomposition (C). Noting that a router adds a model call on every request shows the proposed shortcut adds latency and cost without fixing the underlying scope problem, so decomposition should come first (E). Overlapping descriptions (A) and unused tools (B) are cleanup items rather than decomposition drivers, and the router being well-documented (D) is not evidence about this system."},{"id":68,"q":"A Claude architect needs to ensure that a security-hardening flag cannot be disabled by any individual engineer after it is set. Which configuration scope correctly enforces this requirement?","opts":{"A":"User scope (~/.claude/settings.json) on each engineer's machine","B":"Environment variable defined in the CI/CD pipeline only","C":"Managed configuration applied centrally and marked as non-overridable","D":"Project scope (.claude/settings.json) committed to the repository"},"ans":["C"],"exp":"To guarantee a setting cannot be overridden by any individual engineer, it must be enforced from a higher-authority scope that local settings cannot supersede. Managed configuration applied centrally and marked as non-overridable is precisely the mechanism that locks a value against per-user changes (C). User scope (A) and project scope (D) can be edited by engineers or contributors, and a CI/CD environment variable (B) only affects pipeline runs, not the engineers' local sessions, so none of those enforce the requirement."},{"id":69,"q":"A Claude architect is auditing configuration scope assignments. Which two statements correctly identify an appropriate use of user-scope configuration versus other scopes? (Select two.)","opts":{"A":"Persisting personal editor theme preferences that follow an engineer across projects.","B":"Saving a preferred Claude response language that applies to all repositories the engineer uses.","C":"Enforcing a company-wide policy that disables a feature for all engineers.","D":"Defining MCP server endpoints shared by all contributors to a specific repository.","E":"Storing API authentication keys so they are not committed to version control."},"ans":["A","B"],"exp":"User scope is the right place for personal preferences that should follow an individual engineer across all their projects but not be imposed on others. A personal editor theme (A) and a preferred Claude response language that applies to every repository the engineer uses (B) are exactly these portable, per-person preferences. Enforcing a company-wide policy (C) belongs in managed/enterprise scope so it cannot be overridden, MCP endpoints shared by all contributors to one repo (D) belong in project scope, and API keys (E) should live in secure secret storage or environment variables rather than user settings."},{"id":70,"q":"You are compiling factors that should drive the choice between Model Context Protocol (MCP), direct API integration, and agent-to-agent handoff. Which two factors belong on the list? (Select two.) Each correct answer presents a complete solution.","opts":{"A":"Whether the vendor publishes detailed reference documentation for each candidate protocol.","B":"Whether the team has prior implementation experience with any of the candidate protocols.","C":"Whether the underlying transport supports encryption in transit between the integrated services.","D":"Whether the integration must be portable across multiple AI clients in the ecosystem.","E":"Whether the interaction is stateless and latency-sensitive or stateful and longer-running."},"ans":["D","E"],"exp":"Choosing between MCP, direct API integration, and agent-to-agent handoff should be driven by intrinsic properties of the integration, not incidental team factors. Portability across multiple AI clients favors a standardized protocol like MCP, so whether the integration must work across many clients is a genuine deciding factor (D). The interaction's nature, stateless and latency-sensitive versus stateful and longer-running, maps directly onto which pattern fits, since direct calls suit quick stateless work while agent handoffs suit stateful, longer tasks (E). Vendor documentation quality (A), prior team experience (B), and transport encryption (C) are real considerations but do not by themselves determine the correct integration pattern."},{"id":71,"q":"You are selecting a protocol for a single low-latency stateless tool call from a Claude-based assistant to an internal pricing service that already exposes a stable HTTP API. Which integration mechanism is the most appropriate?","opts":{"A":"A direct API call to the existing endpoint with the appropriate scoped credentials.","B":"A long-lived stateful session protocol for a stateless single-call interaction.","C":"A bespoke streaming protocol layered over an unrelated asynchronous message bus.","D":"An agent-to-agent handoff that introduces another Claude-based agent in front of the pricing service."},"ans":["A"],"exp":"A single, stateless, low-latency call to a service that already exposes a stable HTTP API is best served by a direct API call using appropriately scoped credentials, because that adds the least latency, complexity, and surface area. A long-lived stateful session protocol (B) is overkill and adds overhead for a one-shot interaction. A bespoke streaming protocol over an unrelated message bus (C) introduces needless coupling and failure modes, and inserting another Claude agent in front of the service (D) adds cost, latency, and non-determinism with no benefit for a simple deterministic lookup."},{"id":72,"q":"A Claude architect observes that after a recent model-version upgrade, grounded responses began including claims not supported by the retrieved source documents. Which mitigation is most directly targeted at this failure mode?","opts":{"A":"Constrain responses to source-supported content, require citations, and add a verification step.","B":"Score each new model version against a stable adversarial evaluation set.","C":"Replace the shared API key with per-user OAuth tokens to restrict data access.","D":"Treat retrieved data as untrusted and apply input classifiers at ingestion time."},"ans":["A"],"exp":"The failure is ungrounded generation, where the model asserts claims the retrieved sources do not support, so the most direct mitigation is to constrain answers to source-supported content, require citations, and add a verification step that checks claims against the sources. This directly closes the gap between output and evidence rather than addressing a different concern. Adversarial evaluation (B) helps detect regressions but does not itself enforce grounding at inference time; OAuth tokens (C) address access control, and treating retrieved data as untrusted with input classifiers (D) targets injection or unsafe input, not fidelity to sources."},{"id":73,"q":"You are defining escalation criteria for ambiguous cases in an automated workflow. Which set of criteria best supports consistent escalation?","opts":{"A":"No escalation criteria; the model decides independently on every turn whether to escalate, without explicit confidence thresholds, impact categories, or classifier-based ambiguity flags.","B":"Escalation only after an affected customer has contacted support to complain, after the automated workflow has already completed without human review.","C":"Escalation at the discretion of whoever is available when the team's on-call engineer has spare capacity, without a defined threshold, category, or ambiguity criterion.","D":"A confidence score below a defined threshold, presence of high-impact decision categories, ambiguity flags raised by content classifiers, and the user's explicit request for review."},"ans":["D"],"exp":"Consistent escalation requires objective, pre-defined triggers, which is why option D is correct: a confidence threshold, enumerated high-impact decision categories, classifier-raised ambiguity flags, and an explicit user request together give repeatable, auditable criteria. Letting the model decide independently each turn without thresholds (A) or leaving it to whoever has spare capacity (C) produces inconsistent, unaccountable behavior. Escalating only after a customer complains (B) is reactive and occurs after harm, defeating the purpose of pre-decision human review."},{"id":74,"q":"After a prompt-template update, several previously passing test cases now produce unexpected outputs. Which test type is specifically designed to detect this category of failure?","opts":{"A":"Integration tests that validate cross-component pipeline behavior.","B":"Adversarial tests that probe for prompt-injection vulnerabilities.","C":"Regression tests scored against a stable reference set of known-good behavior.","D":"Smoke tests that confirm high-level system availability after the change."},"ans":["C"],"exp":"When a change causes previously passing cases to break, regression testing is the discipline purpose-built to catch it, comparing current outputs against a stable reference set of known-good behavior so unintended behavioral drift is flagged. Integration tests (A) verify component interactions rather than behavioral consistency of outputs, adversarial tests (B) probe injection and abuse resistance, and smoke tests (D) only confirm the system is broadly up, not that specific outputs still match expectations."},{"id":75,"q":"A Claude architect at a health services organization is defining evaluation metrics for a clinical-summary pipeline. The pipeline must remain within a per-query cost ceiling and must never surface patient data to unauthorized roles. Which two metrics directly address these requirements? (Select two.)","opts":{"A":"BLEU score computed against a human-annotated reference summary set","B":"Role-based access-control enforcement rate measured on a red-team dataset","C":"Throughput measured as successful requests processed per minute","D":"Per-query token cost measured against the defined cost ceiling","E":"Response latency at the 95th percentile across a one-week sample window"},"ans":["B","D"],"exp":"The two stated requirements are a per-query cost ceiling and never exposing patient data to unauthorized roles, so the metrics that directly measure them are per-query token cost against the ceiling (D) and the role-based access-control enforcement rate measured on a red-team dataset (B). BLEU (A), throughput (C), and p95 latency (E) measure summary similarity, capacity, and speed respectively, which are legitimate quality or performance signals but do not address cost control or unauthorized data exposure."},{"id":76,"q":"You are choosing the level of detail for an implementation guide. The audience is a delivery team that will build the deployment. Which guidance composition best serves them?","opts":{"A":"Component responsibilities, contracts between components, sequence diagrams of the dominant flows, configuration parameters with defaults, and operational runbooks.","B":"Component responsibilities and interface contracts only, without sequence diagrams of the dominant flows, configuration parameters with defaults, or runbooks to guide operational tasks.","C":"An architecture overview and sequence diagrams for the dominant flows, without interface contracts, configuration-parameter tables, or operational runbooks for the delivery team to follow.","D":"An architecture overview and a list of known limitations, without component-level diagrams, interface contracts, configuration parameters, or operational runbooks to support implementation."},"ans":["A"],"exp":"A delivery team that will actually build and operate the deployment needs enough to implement and run the system, so the most complete and appropriate composition is A: component responsibilities, inter-component contracts, sequence diagrams of the main flows, configuration parameters with defaults, and operational runbooks. Each other option omits load-bearing artifacts, such as contracts, diagrams, config tables, or runbooks, that an implementing and operating team would otherwise have to reverse-engineer, increasing risk and rework."},{"id":77,"q":"You are identifying the highest-impact optimization for a deployment whose token cost is dominated by a long, repeated system prompt and a large retrieved context per request. Which optimization most directly targets the dominant cost driver?","opts":{"A":"Increase retrieval depth on every request to maximize recall, worsening the dominant cost driver by adding more retrieved tokens per request rather than reducing them.","B":"Add additional repeated content to the system prompt to give the model more guidance.","C":"Move the long, repeated system prompt into a cacheable prefix and trim retrieved context to the spans relevant to each query.","D":"Switch every request to the heaviest available model to maximize output quality, accepting that higher per-request inference cost compounds rather than addresses the dominant cost driver."},"ans":["C"],"exp":"The dominant cost driver is described as a long repeated system prompt plus large retrieved context per request, so the highest-impact fix is to move the repeated prefix into a cacheable segment (so its tokens are billed at a reduced cached rate on reuse) and trim retrieval to only the spans relevant to each query. Increasing retrieval depth (A) or adding more system-prompt content (B) enlarges the very tokens driving cost, and switching every request to the heaviest model (D) raises per-request inference cost rather than reducing input token volume."},{"id":78,"q":"You are defining transparency practices for a customer-facing assistant whose responses are materially shaped by AI. Which transparency practice most directly supports responsible deployment?","opts":{"A":"Misrepresent the AI's role in producing responses in order to make the assistant feel more trustworthy or more human, undermining informed user consent and organizational transparency.","B":"Refuse to answer any user question about how the responses were produced or whether AI was involved, treating the AI's role as confidential operational information.","C":"Disclose AI involvement to end users in line with the organization's transparency policy and provide a documented path to reach a human when needed.","D":"Disclose AI involvement only to internal staff and operators while withholding that information from the end users whose interactions are materially shaped by the AI system."},"ans":["C"],"exp":"Responsible deployment of an assistant whose outputs are materially shaped by AI requires honest disclosure of AI involvement consistent with the organization's transparency policy plus a documented path to reach a human, which is option C. Misrepresenting the AI as human (A) undermines informed consent, refusing to answer how responses were produced (B) withholds material information users are entitled to, and disclosing only internally while hiding it from affected end users (D) defeats the purpose of transparency toward the people actually interacting with the system."},{"id":79,"q":"An engineering organization is adopting Claude Code across 200 developers. A team lead proposes that AI-generated pull requests bypass standard code review for changes under 50 lines because small changes are considered low risk and review capacity is constrained. Which two Diligence-competency objections should you raise? (Select two.) Each correct answer presents part of the solution.","opts":{"A":"Removing review eliminates the verification mechanism required for AI-generated output across the workflow.","B":"Code-review capacity should be expanded to handle every code change submitted across the team.","C":"The threshold should be increased to 200 lines to capture more changes.","D":"AI-generated pull requests should be rejected by default across the organization.","E":"Line count is a poor proxy for the actual risk introduced by a code change."},"ans":["A","E"],"exp":"Under the Diligence competency, the two valid objections are that removing review for AI-generated PRs eliminates the verification mechanism that unreviewed AI output specifically requires (A), and that line count is a weak proxy for real risk since a small diff can change security, data handling, or critical logic (E). Expanding capacity to review everything (B), raising the threshold to 200 lines (C), or rejecting all AI PRs by default (D) either miss the risk-proxy flaw, still bypass verification, or overcorrect without addressing why the proposal is unsound."},{"id":80,"q":"You are defining an SLA for a Claude-based assistant. Which SLA definition is most operationally meaningful?","opts":{"A":"A target tied to a stakeholder sentiment measure such as \"the team feels satisfied,\" which cannot be measured objectively or used to trigger a documented breach response.","B":"A measurable target with a defined metric, threshold, evaluation window, and consequence for breach — for example, \"p95 per-request latency under 800 ms over a 28-day window.\"","C":"A qualitative commitment such as \"the system will be fast and reliable,\" which names no metric, threshold, or evaluation window.","D":"A target that names the metric and threshold but omits the evaluation window and breach consequence, leaving compliance periods and remediation triggers undefined."},"ans":["B"],"exp":"An operationally meaningful SLA must be objectively measurable and enforceable, which is why option B is correct: it specifies a metric, a threshold, an evaluation window, and a breach consequence, for example p95 latency under 800 ms over 28 days. Sentiment-based targets (A) and vague qualitative commitments (C) cannot be measured or enforced, and a target that omits the evaluation window and breach consequence (D) leaves the compliance period and remediation trigger undefined, so it cannot reliably determine whether the SLA was met or what happens if it is not."},{"id":81,"q":"A Claude architect is designing a HIPAA-compliant pipeline that processes patient records. Which two design decisions directly support HIPAA compliance requirements? (Select two.)","opts":{"A":"Setting max_tokens to a low value to minimize the volume of text generated per request.","B":"Selecting the highest-capability Claude model to maximize diagnostic accuracy.","C":"Enforcing role-based access controls so that PHI is retrievable only by authorized personnel.","D":"Ensuring patient data is never included in training feedback loops sent to the model provider without a BAA in place.","E":"Using streaming responses to reduce perceived latency for clinical users."},"ans":["C","D"],"exp":"HIPAA compliance centers on controlling who can access protected health information (PHI) and on contractual data-handling safeguards with any party that touches PHI. Enforcing role-based access controls (C) ensures PHI is disclosed only to authorized personnel, directly satisfying the minimum-necessary and access-control requirements. Keeping patient data out of provider training loops without a Business Associate Agreement (D) addresses HIPAA's requirement that any vendor processing PHI be bound by a BAA. Options A, B, and E concern token limits, model capability, and latency, which are performance or UX choices with no direct bearing on HIPAA's privacy and security obligations."},{"id":82,"q":"You are designing a human-in-the-loop validation workflow for a new Claude-based deployment and must complete the design steps before piloting the workflow. Which two steps must be completed BEFORE piloting the workflow with a representative subset of traffic? (Select two.) Each correct answer presents part of the solution.","opts":{"A":"Define the sampling strategy and the escalation criteria at each oversight point in the pipeline.","B":"Iterate the workflow design based on observed pilot findings before broader rollout to production.","C":"Onboard the reviewer pool with role-specific training on the check criteria and escalation procedures.","D":"Document the workflow with check criteria, escalation paths, and service-level agreements (SLAs) for each step.","E":"Identify the decision points in the pipeline that require human oversight by impact and reversibility."},"ans":["A","E"],"exp":"Before piloting, the design must first establish where human oversight is actually needed and how it will operate. Identifying decision points by impact and reversibility (E) is foundational because it determines which steps warrant a human check at all. Defining the sampling strategy and escalation criteria at each oversight point (A) then specifies how the pilot will operate and route exceptions. Options B (iterating on pilot findings) and C/D describe activities that logically follow the pilot or depend on the finalized design; iterating on findings cannot precede the pilot that produces them."},{"id":83,"q":"You are compiling team-setup practices for a Claude Code rollout across an engineering organization. Which two practices belong on the list? (Select two.) Each correct answer presents a complete solution.","opts":{"A":"Use project scope for team-shared Model Context Protocol (MCP) servers and permission rules under version control.","B":"Apply managed configuration centrally for security-critical settings that must not be overridden by individual engineers.","C":"Use local scope for security-critical permission rules so each engineer can adapt them to ongoing work.","D":"Use user scope for team-shared MCP servers so every engineer on the team has consistent access.","E":"Use project scope for personal editor preferences so the preferences apply consistently within the project."},"ans":["A","B"],"exp":"In Claude Code, configuration scopes control who a setting applies to and who can change it. Project scope under version control (A) is correct for team-shared MCP servers and permission rules because it keeps them consistent, reviewable, and shared across the team. Managed/enterprise-level configuration (B) is correct for security-critical settings that individual engineers must not override, since it enforces them centrally. The wrong options invert scope purpose: local scope (C) is per-machine and would let engineers weaken security rules, user scope (D) is personal rather than team-shared, and personal editor preferences (E) do not belong in shared project scope."},{"id":84,"q":"You are reviewing a customer-support agent's configuration. Each candidate tool falls into one of four categories: (1) required to complete defined tasks, (2) frequently used and reduces handoffs, (3) occasionally useful for unrelated work, (4) speculative future utility. Which categories should typically remain in the agent configuration?","opts":{"A":"Only category 3, because occasionally useful tools for unrelated work provide broader coverage and should take priority over tools required for the agent's defined tasks.","B":"Only category 4, because speculative future-utility tools provide the most flexibility and should be configured even when no defined task currently requires them.","C":"Categories 1 and 2 only, because they map to defined tasks and the agent's regular hand-offs.","D":"All four categories, because broader tool access is categorically better for agent performance regardless of whether the tools map to defined tasks or regular hand-offs."},"ans":["C"],"exp":"An agent should carry only the tools that map to its actual responsibilities, because excess tools enlarge the attack surface, add latency, and increase the chance the model selects the wrong tool. Categories 1 (required for defined tasks) and 2 (frequently used, reducing handoffs) both tie directly to the agent's real workload, so C is correct. Categories 3 and 4 (occasionally useful for unrelated work, or speculative future utility) add capability the agent does not need now, contradicting the principle of least privilege and minimal, purposeful tooling reflected in the wrong answers A, B, and D."},{"id":85,"q":"You are documenting an architectural decision to support future audit and onboarding. Which artifact is the strongest fit?","opts":{"A":"A slide deck in a presentation folder with no accompanying written rationale.","B":"A code comment in a single file that contains an opinion of one engineer.","C":"An Architecture Decision Record that states the context, the decision, the alternatives considered, the consequences, and the date and authors.","D":"A short verbal note shared during a hallway conversation with no written record."},"ans":["C"],"exp":"An Architecture Decision Record (C) is the strongest artifact because it durably captures the context, the decision, the alternatives considered, the consequences, and the date and authors, which is exactly what future auditors and new team members need to understand why a choice was made. A slide deck without rationale, a single engineer's opinion in a code comment, and an unrecorded hallway note all fail to preserve reasoning in a discoverable, authoritative form. Only the ADR provides the traceability and completeness required for audit and onboarding."},{"id":86,"q":"During an architectural review, the security team identifies a risk that adversarial content injected into retrieved documents could manipulate the model's behavior. Which mitigation most directly addresses this threat?","opts":{"A":"Treat all retrieved content as untrusted input and apply input classifiers with output validation.","B":"Require citations for each claim and constrain responses to source-supported content.","C":"Restrict outbound tool calls to an approved destination allow-list.","D":"Score outputs against a stable adversarial evaluation set on each model-version change."},"ans":["A"],"exp":"The threat described is indirect prompt injection, where malicious instructions hidden in retrieved documents attempt to hijack the model. The most direct mitigation is to treat all retrieved content as untrusted input and apply input classifiers plus output validation (A), which addresses the injection at the point of ingestion and again at generation. Citations (B), outbound allow-lists (C), and adversarial eval scoring (D) are useful defense-in-depth measures but address grounding, exfiltration, and regression testing respectively rather than neutralizing the injected instructions themselves."},{"id":87,"q":"You are evaluating an evaluation set used to score a Claude-based hiring-support tool. The set is drawn from one geographic region and one tenure band. Which response is most appropriate?","opts":{"A":"Discard all quantitative evaluation and replace it with qualitative impressions collected from a small, convenience-selected group that may not represent the tool's full user population.","B":"Expand the evaluation set to cover the geographic regions and tenure bands the tool will serve, and rescore the system on the expanded set before broader release.","C":"Reduce the evaluation set further to a single demographic subgroup to simplify score interpretation, narrowing coverage rather than expanding it to match the intended user population.","D":"Continue using the narrow evaluation set drawn from one region and one tenure band because the existing benchmark scores are already high on that subset."},"ans":["B"],"exp":"An evaluation set drawn from a single region and tenure band does not represent the full population the hiring tool will serve, so its scores cannot be trusted to reveal disparate performance or bias across groups. The appropriate response (B) is to expand the eval set to cover the regions and tenure bands in scope and rescore before broader release. Discarding quantitative evaluation for convenience impressions (A), narrowing further to one subgroup (C), or trusting the high but unrepresentative scores (D) all reduce coverage or rigor exactly when broader, fairer measurement is required."},{"id":88,"q":"You must present an architectural recommendation to deploy a Claude-based contract review assistant to a steering committee that includes the CFO, the general counsel, and the CIO. Each stakeholder cares about different aspects of the decision. How should you structure the recommendation document?","opts":{"A":"Lead with the technical architecture diagram and the full component list before any other section.","B":"Lead with detailed cost projections across the full multi-year horizon before the rationale section.","C":"Present the same dense narrative throughout with no stakeholder differentiation in any section.","D":"Lead with the architectural decision, then address each stakeholder's primary concerns directly."},"ans":["D"],"exp":"A steering committee with a CFO, general counsel, and CIO needs a decision-oriented document that speaks to each stakeholder's distinct concerns (cost, legal risk, and technical/operational fit). Leading with the architectural decision and then addressing each stakeholder's primary concern directly (D) gives executives the recommendation up front and tailors the supporting detail to what each cares about. Leading with a technical diagram (A), multi-year cost tables (B), or an undifferentiated dense narrative (C) buries the decision and ignores that different stakeholders weigh different factors."},{"id":89,"q":"You are compiling a diagnostic toolkit for Claude Code operational issues. Which two diagnostic actions belong in the toolkit? (Select two.) Each correct answer presents a complete solution.","opts":{"A":"Increase the model sampling temperature so that intermittent issues surface more frequently for analysis.","B":"File a support ticket with vendor support before any local reproduction or evidence collection.","C":"Reproduce the issue with a minimal reproduction case that isolates one variable at a time.","D":"Roll back to the previous Claude Code version immediately to confirm whether the issue is version specific.","E":"List the configured Model Context Protocol (MCP) servers and inspect server status to identify connection failures."},"ans":["C","E"],"exp":"Sound diagnosis starts by isolating cause with controlled, evidence-based steps. Reproducing the issue with a minimal case that changes one variable at a time (C) isolates the root cause reliably, and listing configured MCP servers and inspecting their status (E) surfaces connection failures that are a common source of Claude Code problems. Raising temperature to make issues appear more often (A) adds nondeterminism rather than clarity, filing a vendor ticket before any local investigation (B) is premature, and immediately rolling back versions (D) is a blunt action taken before evidence is gathered."},{"id":90,"q":"A Claude Architect is reviewing a post-deployment performance report for an AI-assisted legal-document summarization system. The report includes these observations: * Average summarization time decreased from 47 minutes to 6 minutes per document. * Associates spend less time on summaries, but overall billable output has not measurably changed. * Infrastructure costs increased by 22% because redundant retry logic generated additional API calls. * Some summaries require attorney correction, adding an average of 8 minutes of review per document. Which analysis correctly attributes each observation to the appropriate business-value pillar?","opts":{"A":"Observations 1 and 2 both indicate efficiency gains; Observation 3 is a solution-cost issue; Observation 4 is a performance-SLA issue.","B":"Observation 1 is a transformation outcome; Observation 2 is an efficiency gain; Observation 3 is a performance-SLA degradation; Observation 4 is a solution-cost issue.","C":"Observations 1 and 4 together indicate a net performance-SLA improvement; Observation 2 is a transformation gap; Observation 3 is a productivity drain from over-engineering.","D":"Observation 1 indicates an efficiency gain; Observation 2 shows that productivity has not yet been realized; Observation 3 is a solution-cost issue; Observation 4 is an efficiency loss that partially offsets Observation 1."},"ans":["D"],"exp":"Each observation maps to a distinct business-value pillar, so answer D is the correct attribution. Observation 1 (47 to 6 minutes) is a clear efficiency gain in task time, while Observation 2 shows that time saved has not translated into more billable output, meaning the productivity or transformation benefit has not yet been realized. Observation 3 (22% cost rise from redundant retries) is a solution-cost issue caused by over-engineering, and Observation 4 (8 minutes of attorney correction per document) is an efficiency loss that partially offsets the gain in Observation 1. The other options misclassify these, for example by calling the extra review a performance-SLA issue or ignoring that the raw speed gain has not yet produced realized productivity."},{"id":91,"q":"You are supporting an engineer whose newly added MCP server does not appear in their Claude Code session. Which diagnostic step should be tried first?","opts":{"A":"Disable every MCP server in the configuration to isolate the issue, removing all tool access rather than confirming whether the new server is registered.","B":"Switch the team to a different Claude product family unrelated to the existing workflow, abandoning the current configuration rather than diagnosing the registration issue.","C":"Verify the MCP server is registered using the listing command, then reconnect the session if needed, since configuration changes typically require a restart to take effect.","D":"Reinstall the developer's operating system from scratch, discarding all local configuration and tool state before attempting any targeted diagnostic steps."},"ans":["C"],"exp":"When a newly added MCP server does not appear, the fastest low-cost diagnostic is to confirm the server is actually registered using the listing command (such as claude mcp list) and then restart or reconnect the session, because MCP configuration changes are read at startup and typically require a session restart to take effect. Option C follows the principle of starting with the least disruptive check that directly targets the likely cause. Disabling all servers (A), switching product families (B), or reinstalling the OS (D) are drastic, destructive, and disproportionate to a simple registration or restart issue."},{"id":92,"q":"You are a solution architect designing a Claude-based assistant with access to 60 internal tools across multiple business domains. Loading every tool definition on every request increases token usage and time to first response. Which design pattern best addresses this issue without sacrificing capability breadth?","opts":{"A":"Apply progressive tool discovery so a curated initial subset is exposed and additional tools are loaded on demand based on the task.","B":"Use a separate model call to summarize all 60 tool definitions before each user turn.","C":"Increase the maximum context length and load all 60 tool definitions on every request, accepting the higher token cost and latency as necessary for full capability.","D":"Hard-code a fixed set of five tools per request to reduce token usage, regardless of whether those tools are relevant to the current task."},"ans":["A"],"exp":"Progressive tool discovery exposes a small, relevant subset of tools initially and loads additional definitions on demand as the task requires, which keeps prompt token usage and time-to-first-response low while preserving access to all 60 tools when needed. This directly addresses the cost of loading every definition on every request without discarding capability breadth. Summarizing all tools each turn (B) still incurs the full cost plus an extra call, always loading everything (C) accepts the very latency and token problem being solved, and a fixed five tools (D) sacrifices relevance and breadth."},{"id":93,"q":"The compliance team at a firm has approved a Claude Skill that generates client-facing investment summaries. The Skill includes the firm's required disclaimers and prohibited-language list. A product manager has asked whether additional guardrails are needed at the application layer or whether the Skill alone is sufficient. Which two guardrail responsibilities should remain at the application layer rather than the Skill? (Select two.) Each correct answer presents part of the solution.","opts":{"A":"Log every generated summary to the firm's compliance audit trail for retention.","B":"Verify the requesting user is authorized to generate investment summaries at all.","C":"Format output sections according to the firm's standardized house style guidelines.","D":"Apply the disclaimer template that the compliance team has standardized firm-wide.","E":"Apply the prohibited-language list that the compliance team maintains and updates."},"ans":["A","B"],"exp":"Skills package reusable domain content and generation logic, but cross-cutting security and system concerns belong to the surrounding application. Authorization (B) must be enforced at the application layer because a Skill cannot reliably verify whether the requesting user is entitled to invoke it, and audit logging for retention (A) is a systemic compliance obligation that must persist independent of and around every invocation. The disclaimer template (D), prohibited-language list (E), and house-style formatting (C) are content and formatting responsibilities the compliance team already embedded in the Skill itself."},{"id":94,"q":"You are supporting an EU-based deployment with GDPR obligations. Which combination of measures best supports the deployment's GDPR posture?","opts":{"A":"enterprise-tier deployment with a signed Data Processing Addendum, defined data-retention configuration, redaction of personal data not needed for the task, and documented data-subject-rights handling","B":"disabling all data-retention configuration, redaction controls, and data-subject-rights handling to simplify day-to-day operations, accepting the resulting GDPR compliance exposure","C":"using a personal Claude account tier for processing EU personal data at scale, with no signed Data Processing Addendum and no documented data-subject-rights handling procedure","D":"pasting full EU personal data into every prompt to \"give Claude complete context\" without considering purpose limitation, data minimization, or the organization's Data Processing Addendum obligations"},"ans":["A"],"exp":"A defensible GDPR posture combines a signed Data Processing Addendum with the processor, a defined retention configuration, redaction of personal data not needed for the task (data minimization and purpose limitation), and documented handling of data-subject rights such as access and erasure. Option A bundles exactly these controls. Disabling retention, redaction, and rights handling (B), using a personal tier with no DPA (C), or pasting full personal data into every prompt (D) each violate core GDPR principles like lawful processing, minimization, and accountability."},{"id":95,"q":"You are reviewing instrumentation in a multi-agent system. Which two findings constitute valid observability gaps in the instrumentation? (Select two.) Each correct answer presents a complete solution.","opts":{"A":"Trace spans for each agent step are exported to the shared distributed-tracing backend.","B":"Latency and token usage on every span are emitted to the central metrics pipeline.","C":"Tool-call payloads and outcomes are recorded with redaction applied to known sensitive fields.","D":"Model identity and version on each turn are not recorded with the turn artifacts.","E":"Request-scoped correlation identifiers do not propagate across agent and tool calls."},"ans":["D","E"],"exp":"Good observability in a multi-agent system requires that you can attribute behavior to a specific model and version and can follow a single request end to end. Not recording model identity and version per turn (D) is a real gap because it prevents diagnosing regressions after model changes, and failing to propagate request-scoped correlation identifiers across agent and tool calls (E) breaks the ability to stitch a distributed trace together. The other findings describe present, healthy instrumentation: exported trace spans (A), latency and token metrics (B), and redacted tool-call payloads (C)."},{"id":96,"q":"When communicating an architectural decision to a security and compliance reviewer, which content set is most aligned with that audience's primary concerns?","opts":{"A":"Feature delivery schedule, roadmap dependencies, and scope boundaries for the product manager.","B":"Implementation timeline, component interfaces, and deployment sequence for the engineering team.","C":"Threat model, control mappings, residual-risk acceptance criteria, and audit traceability.","D":"Decision rationale, business outcomes, and high-level risk summary for executive review."},"ans":["C"],"exp":"A security and compliance reviewer cares about how risk is identified, controlled, and evidenced, so the most aligned content is the threat model, mappings from threats to controls, explicit residual-risk acceptance criteria, and audit traceability. Option C matches that audience's mandate. Delivery schedule and roadmap (A) target product managers, implementation timelines and interfaces (B) target engineers, and business outcomes with a high-level risk summary (D) target executives, so none of those address the reviewer's primary controls-and-evidence concerns."},{"id":97,"q":"You are defining when to introduce a project subagent versus relying on Claude Code's general capabilities. Which scenario most directly justifies a dedicated subagent?","opts":{"A":"The team has a recurring specialized task, such as database schema review, that requires a focused system prompt, narrow tool permissions, and a specific model selection across many sessions.","B":"The team has a one-time ad hoc question that will not recur and does not require a focused system prompt, narrow tool permissions, or dedicated model selection.","C":"The team has no recurring specialized tasks and uses Claude Code only for isolated general-purpose work that does not justify a dedicated system prompt or tool scope.","D":"The team wants every Claude Code interaction to use the same generic system prompt with no task-specific specialization, narrow tool permissions, or dedicated model selection."},"ans":["A"],"exp":"A dedicated subagent is justified when there is a recurring, specialized task that benefits from a focused system prompt, narrowly scoped tool permissions, and a deliberate model choice reused across many sessions, such as ongoing database schema review. Option A captures all of these justifying factors. A one-time question (B), the absence of any recurring specialized work (C), and a desire for a single generic prompt with no specialization (D) all describe situations where the overhead of building and maintaining a subagent adds no value."},{"id":98,"q":"You are identifying signals that a deployment should re-enter design rather than continue iterating in place. Which signal most directly indicates the need for a new design cycle?","opts":{"A":"A minor copy edit is requested in a customer-facing string within the existing UI, which can be handled as a localized content change without altering component responsibilities or contracts.","B":"A dashboard alert threshold needs a small numerical adjustment to reduce false-positive noise, which can be handled as an operational configuration change without a new design cycle.","C":"A runbook step requires a clarification edit to improve on-call guidance accuracy, which can be handled as a documentation update without changes to component responsibilities or core contracts.","D":"The system's current architecture cannot meet the new requirements without changes to component responsibilities or core contracts."},"ans":["D"],"exp":"The signal to re-enter a design cycle rather than iterate in place is when the current architecture fundamentally cannot satisfy new requirements without changing component responsibilities or core contracts, because that is a structural change rather than a tweak. Option D describes exactly that. A copy edit (A), an alert threshold adjustment (B), and a runbook clarification (C) are all localized content, configuration, or documentation changes that leave responsibilities and contracts intact, so they do not warrant a new design cycle."},{"id":99,"q":"You are rolling out monitoring for a Claude-based deployment and must complete the specification steps before instrumenting the deployment. Which two steps must be completed BEFORE instrumenting the deployment to emit metrics and traces? (Select two.) Each correct answer presents part of the solution.","opts":{"A":"Define the metrics and the slices the deployment will monitor across normal and adversarial traffic.","B":"Tune the alert thresholds based on observed normal-state distributions to reduce false positives.","C":"Define the service-level objectives (SLOs) and the error budgets the deployment will be held to.","D":"Build the dashboards that surface metrics across slices at the cadence the team operates on.","E":"Document the dashboards, alerts, and runbooks for the on-call rotation that will respond."},"ans":["A","C"],"exp":"Before you can instrument a deployment, you must first specify what you intend to measure and the targets you will hold it to: defining the metrics and the slices to monitor across normal and adversarial traffic (A) and defining the SLOs and error budgets (C). These specification steps determine what instrumentation to emit and against what standard. Tuning thresholds (B), building dashboards (D), and documenting alerts and runbooks (E) all depend on metrics and traces already flowing, so they necessarily come after instrumentation."},{"id":100,"q":"You are integrating Claude Code into a team workflow and must complete the design and configuration steps before piloting the integrated workflow with a small group. Which two steps must be completed BEFORE piloting the integrated workflow? (Select two.) Each correct answer presents part of the solution.","opts":{"A":"Document the integrated workflow with handoff criteria, permission boundaries, and on-call runbooks.","B":"Identify the workflow steps where AI-assisted tooling adds value and where human authority must remain.","C":"Negotiate the workflow change with affected teams and obtain formal sign-off from each manager.","D":"Iterate the integrated workflow based on pilot findings before broader rollout to the team.","E":"Configure the project-scope MCP servers, permissions, subagents, and persistent project context."},"ans":["B","E"],"exp":"Before piloting an integrated Claude Code workflow you must complete the design and configuration work: identify which steps benefit from AI assistance versus where human authority must remain (B), and configure project-scope MCP servers, permissions, subagents, and persistent project context (E). These define the workflow and stand up the environment the pilot will exercise. Documenting handoff criteria and runbooks (A) and formal manager sign-off (C) are broader rollout concerns, and iterating on pilot findings (D) by definition happens after the pilot, not before."},{"id":101,"q":"You are preparing a HIPAA-eligible deployment for a healthcare customer. Which configuration supports HIPAA compliance using Anthropic-offered tools?","opts":{"A":"Claude Free with no contractual addendum, since consumer products meet HIPAA requirements out of the box.","B":"Claude Enterprise with a signed Business Associate Agreement, Zero Data Retention enabled, and audit logging configured for compliance tracking.","C":"Disabling all audit logging so that no PHI is recorded in any log store, on the assumption that the absence of logs satisfies HIPAA requirements without a signed BAA.","D":"An ad-hoc personal Claude account used by individual clinicians for PHI-related tasks, with no Business Associate Agreement, no Zero Data Retention, and no audit logging configured."},"ans":["B"],"exp":"HIPAA compliance for regulated PHI workloads requires both contractual and technical safeguards. The correct choice pairs a Business Associate Agreement, which is the legally required contract making Anthropic accountable for PHI handling, with Zero Data Retention to minimize stored protected data and audit logging to demonstrate accountability. Consumer tiers like Claude Free and ad-hoc personal accounts carry no BAA and are not covered, and deliberately disabling audit logging does not satisfy HIPAA because the absence of logs actually removes the accountability and traceability the rule demands rather than creating compliance."},{"id":102,"q":"You are listing characteristics of strong architectural-decision communication. Which two characteristics belong on the list? (Select two.) Each correct answer presents a complete solution.","opts":{"A":"Ownership and review cadence for revisiting the decision when conditions or assumptions change.","B":"Distribution to a standing review forum with mandatory attendance from senior engineering leaders.","C":"Omission of rejected alternatives to keep the decision document focused and concise for readers.","D":"Alternatives considered along with the criteria that were used to evaluate each alternative.","E":"Use of a consistent template across the team to standardize the visual presentation of decisions."},"ans":["A","D"],"exp":"Strong architectural-decision records capture the reasoning so future readers can re-evaluate the choice. Documenting alternatives considered together with the evaluation criteria (D) shows why the selected option won and lets others judge whether the trade-offs still hold. Assigning ownership and a review cadence (A) ensures the decision is revisited when assumptions change rather than silently going stale. Mandatory senior attendance, omitting rejected alternatives, and a shared visual template are process or cosmetic concerns that do not, by themselves, make the decision communication substantively strong."},{"id":103,"q":"You are integrating Claude Code into a workflow that runs against a production database. Which guardrail design most directly preserves safety on data-modifying operations?","opts":{"A":"Allow Claude Code to write directly to the production database without subagent scoping, read-only credential defaults, or human confirmation gates on data-modifying operations.","B":"Configure the database MCP server with a fully privileged credential that can perform any read or write operation, and allow all operations to proceed without explicit human confirmation.","C":"Disable all logging and auditing on database operations through the MCP server to reduce alert noise, removing the observability needed to detect unintended data modifications.","D":"Configure the database MCP server with a read-only credential by default, restrict the subagent's tool list to read-only operations, and require explicit human confirmation on any operation that would modify data."},"ans":["D"],"exp":"The safest guardrail for data-modifying operations layers defense in depth: default read-only credentials, a subagent tool list limited to read-only operations, and mandatory human confirmation before any write (D). This ensures that even if the model attempts an unintended mutation, the credential and tool scope prevent it and a human gates the exception. Writing directly with no gates, granting a fully privileged credential with no confirmation, or disabling logging all remove exactly the least-privilege controls and observability that keep a production database safe."},{"id":104,"q":"You are building an evaluation pipeline for a Claude-based deployment and must complete the specification steps before running the deployment against the dataset. Which two steps must be completed BEFORE running the deployment against the evaluation dataset? (Select two.) Each correct answer presents part of the solution.","opts":{"A":"Publish the aggregated metrics to a dashboard and gate releases on threshold checks.","B":"Curate and label the evaluati
