<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAR-P · Luyện thi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%277%27%20fill%3D%27%231f4fd8%27%2F%3E%3Cpath%20d%3D%27M16%206.5%20L28.5%2012%20L16%2017.5%20L3.5%2012%20Z%27%20fill%3D%27%23ffffff%27%2F%3E%3Cpath%20d%3D%27M10.5%2014.3%20L16%2016.7%20L21.5%2014.3%20L21.5%2018%20Q16%2021%2010.5%2018%20Z%27%20fill%3D%27%23ffffff%27%2F%3E%3Cpath%20d%3D%27M16%2012%20L24%2012.4%20L24%2018.2%27%20fill%3D%27none%27%20stroke%3D%27%23ffffff%27%20stroke-width%3D%271.1%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%2F%3E%3Ccircle%20cx%3D%2724%27%20cy%3D%2719%27%20r%3D%271.5%27%20fill%3D%27%23ffffff%27%2F%3E%3C%2Fsvg%3E">
<style>
:root{
  --bg:#eceef1; --surface:#fff; --ink:#14171c; --muted:#616a77; --line:#dce0e5;
  --accent:#1f4fd8; --accent-soft:#e8edfc;
  --ok:#14733c; --ok-bg:#e6f4ea; --ok-line:#a9d8ba;
  --bad:#a8291b; --bad-bg:#fcebe8; --bad-line:#eab5ac;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:780px;margin:0 auto;padding:24px 18px 80px}

header.top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:22px}
header.top h1{font-size:19px;font-weight:660;letter-spacing:-.01em;margin:0}
header.top .sub{color:var(--muted);font-size:14px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px}

/* ---- setup ---- */
.field{margin-bottom:20px}
.field > .lbl{font-size:14px;font-weight:600;margin-bottom:8px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:7px 14px;font-size:14px;cursor:pointer;color:var(--ink);
  font-family:inherit;
}
.chip:hover{border-color:#b9c0ca}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.hint{color:var(--muted);font-size:13px;margin-top:8px}
.row-check{display:flex;align-items:center;gap:9px;font-size:15px;cursor:pointer}

.btn{
  font-family:inherit;font-size:15px;font-weight:600;border-radius:8px;
  padding:11px 20px;cursor:pointer;border:1px solid transparent;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#1a44bd}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:#b9c0ca}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}

/* ---- quiz ---- */
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:18px}
.bar > i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;color:var(--muted);margin-bottom:14px}
.meta .tag{border:1px solid var(--line);border-radius:5px;padding:2px 8px}
.qtext{font-size:17px;line-height:1.62;margin:0 0 8px}
.note{font-size:13.5px;color:var(--accent);font-weight:600;margin:10px 0 14px}

.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{
  display:flex;gap:11px;align-items:flex-start;
  border:1px solid var(--line);border-radius:8px;padding:12px 14px;
  cursor:pointer;background:#fff;
}
.opt:hover{border-color:#b9c0ca}
.opt input{margin:4px 0 0;flex:none;accent-color:var(--accent)}
.opt .k{font-weight:660;flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--ok-line);background:var(--ok-bg)}
.opt.bad{border-color:var(--bad-line);background:var(--bad-bg)}
.opt.locked{cursor:default}

/* yes/no + match rows */
.srow{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.srow .s{flex:1 1 260px;min-width:0}
.yn{display:flex;gap:6px;flex:none}
.yn button{font-family:inherit;font-size:14px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 16px;cursor:pointer;color:var(--ink)}
.yn button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.srow.ok{border-color:var(--ok-line);background:var(--ok-bg)}
.srow.bad{border-color:var(--bad-line);background:var(--bad-bg)}
.srow select{font-family:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);max-width:100%}
.truth{font-size:13px;color:var(--ok);font-weight:600;flex:none}
.truth.miss{color:var(--bad)}

.verdict{margin-top:18px;font-size:15px;font-weight:600}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}

.explain{margin-top:12px;background:var(--accent-soft);border:1px solid #c8d6f7;border-left:3px solid var(--accent);border-radius:8px;padding:13px 15px;font-size:14.5px;line-height:1.6;color:var(--ink)}
.explain .eh{display:block;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--accent);margin-bottom:5px}
.explain p{margin:0 0 7px}
.explain p:last-child{margin-bottom:0}
.explain ul{margin:6px 0 0;padding-left:20px}
.explain li{margin:4px 0}
.explain li:first-child{margin-top:0}
.explain strong{font-weight:700}

/* ---- result ---- */
.score{font-size:44px;font-weight:680;letter-spacing:-.02em;line-height:1.1}
.score small{font-size:17px;font-weight:500;color:var(--muted);letter-spacing:0}
.rlist{margin-top:22px;border-top:1px solid var(--line)}
.ritem{border-bottom:1px solid var(--line);padding:13px 0;display:flex;gap:12px;align-items:flex-start;font-size:14.5px}
.ritem .n{flex:none;width:42px;color:var(--muted);font-variant-numeric:tabular-nums}
.ritem .st{flex:none;font-weight:660}
.ritem .st.ok{color:var(--ok)}
.ritem .st.bad{color:var(--bad)}
.hide{display:none !important}
@media (max-width:520px){
  .wrap{padding:18px 13px 70px}
  .qtext{font-size:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>CCAR-P · Luyện thi</h1>
    <span class="sub" id="topSub">116 câu hỏi</span>
  </header>

  <!-- SETUP -->
  <section id="setup" class="panel">
    <div class="field">
      <span class="lbl">Chế độ</span>
      <div class="chips" id="modeChips">
        <button class="chip" data-v="practice" aria-pressed="true">Luyện tập</button>
        <button class="chip" data-v="exam" aria-pressed="false">Thi thử</button>
      </div>
      <p class="hint" id="modeHint">Kiểm tra và xem đáp án ngay sau mỗi câu.</p>
    </div>

    <div class="field">
      <span class="lbl">Phạm vi</span>
      <div class="chips" id="setChips">
        <button class="chip" data-v="all" aria-pressed="true">Tất cả</button>
        <button class="chip" data-v="1" aria-pressed="false">Set 1</button>
        <button class="chip" data-v="2" aria-pressed="false">Set 2</button>
        <button class="chip" data-v="3" aria-pressed="false">Set 3</button>
        <button class="chip" data-v="4" aria-pressed="false">Set 4</button>
        <button class="chip" data-v="5" aria-pressed="false">Set 5</button>
        <button class="chip" data-v="6" aria-pressed="false">Set 6</button>
        <button class="chip" data-v="wrong" aria-pressed="false">Câu từng sai</button>
      </div>
      <p class="hint" id="scopeHint"></p>
    </div>

    <div class="field">
      <span class="lbl">Số câu</span>
      <div class="chips" id="countChips">
        <button class="chip" data-v="0" aria-pressed="true">Toàn bộ</button>
        <button class="chip" data-v="10" aria-pressed="false">10</button>
        <button class="chip" data-v="20" aria-pressed="false">20</button>
        <button class="chip" data-v="40" aria-pressed="false">40</button>
      </div>
    </div>

    <div class="field">
      <label class="row-check"><input type="checkbox" id="shuffleQ" checked> Xáo trộn thứ tự câu hỏi</label>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="startBtn">Bắt đầu</button>
      <button class="btn btn-ghost" id="clearBtn">Xoá lịch sử câu sai</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hide">
    <div class="bar"><i id="barFill" style="width:0%"></i></div>
    <div class="panel">
      <div class="meta">
        <span id="qPos"></span>
        <span class="tag" id="qTag"></span>
      </div>
      <p class="qtext" id="qText"></p>
      <p class="note hide" id="qNote"></p>
      <div id="qBody"></div>
      <div class="verdict hide" id="verdict"></div>
      <div class="explain hide" id="explain"></div>
      <div class="actions">
        <button class="btn btn-primary" id="checkBtn">Kiểm tra</button>
        <button class="btn btn-primary hide" id="nextBtn">Câu tiếp</button>
        <button class="btn btn-ghost" id="quitBtn">Dừng</button>
      </div>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="panel hide">
    <div class="score" id="scoreNum"></div>
    <p class="hint" id="scoreLine"></p>
    <div class="rlist" id="reviewList"></div>
    <div class="actions">
      <button class="btn btn-primary" id="againBtn">Làm lại</button>
      <button class="btn btn-ghost" id="wrongBtn">Luyện lại câu sai</button>
    </div>
  </section>
</div>

<script>
const QUESTIONS = [{"id":1,"q":"You are configuring tool permissions for a Claude-based assistant. The assistant's defined responsibilities require read access to a knowledge base and write access to a draft queue, and nothing else. Which scoping design best applies least privilege?","opts":{"A":"Allow access to all tools with read permissions globally and restrict write permissions to the draftqueue tool, without scoping to only the specific tools required for defined tasks.","B":"Per-role allow-list of exactly the read-knowledge-base and write-draft-queue tools, enforced at the orchestration layer.","C":"Allow access to every tool in the catalog and rely on the model to decline tools it should not use.","D":"Disable all tools entirely to achieve a minimal permission surface, accepting that the assistant can no longer perform the read-knowledge-base or write-draft-queue tasks it was designed for."},"ans":["B"],"exp":"**Least privilege** means granting exactly the permissions a role needs and nothing more, enforced by the system rather than trusted to the model's judgment.\n- **B** is correct: a per-role allow-list of just the read-knowledge-base and write-draft-queue tools, enforced at the **orchestration layer**, gives precisely the two required capabilities while denying everything else by default.\n- **A** still grants broad **global read access**.\n- **C** relies on the model voluntarily declining tools, which is not an enforceable control.\n- **D** over-restricts by disabling the very tools the assistant needs to function."},{"id":2,"q":"You are running a controlled experiment to compare two prompts and must complete the design steps before executing the experiment. Which two steps must be completed BEFORE running the experiment with random assignment? (Select two.) Each correct answer presents part of the solution.","opts":{"A":"Determine the minimum detectable effect size and the sample size needed for power.","B":"Decide whether to promote, reject, or iterate the candidate based on the analysis.","C":"Define the hypothesis and the primary success metric for the comparison.","D":"Analyze the results against the predefined success metric and significance threshold.","E":"Document the recommendation, the trade-offs accepted, and the alternatives considered."},"ans":["A","C"],"exp":"A sound controlled experiment is **fully designed before any data is collected**, so the analysis cannot be biased by peeking or post-hoc reasoning.\n- **C** fixes what you are testing and how you will judge it by defining the **hypothesis** and **primary success metric**.\n- **A** ensures the experiment can actually detect a meaningful difference by determining the **minimum detectable effect** and required **sample size** for adequate power.\n- **B, D, and E** all describe steps that occur during or after execution, so they cannot be prerequisites to running the experiment."},{"id":3,"q":"You are reviewing a peer's Claude Code permission rules for an enterprise rollout. The rules grant unrestricted Bash access to all projects across all developers. Which response is most appropriate?","opts":{"A":"Add unrestricted access to additional tool categories as well, so that Bash is not asymmetrically more permissive than other tools, expanding the attack surface further in the name of consistency.","B":"Approve the unrestricted Bash access as written on the grounds that narrowing the rules would add configuration complexity, accepting the full attack surface for all engineers across all projects.","C":"Replace unrestricted Bash with narrowly scoped tool patterns that allow only the specific commands the workflows require, and add explicit deny rules for sensitive operations.","D":"Disable all permission rules for the enterprise rollout so every command across every project runs without any tool-pattern scoping or explicit deny rules for sensitive operations."},"ans":["C"],"exp":"Unrestricted Bash across all projects and developers grants **arbitrary command execution**, one of the largest possible attack surfaces and a violation of **least privilege**.\n- **C** is correct: replace it with narrowly scoped tool patterns permitting only the specific commands the workflows need, plus explicit **deny rules** for sensitive operations, preserving functionality while minimizing risk.\n- **A** expands the attack surface further.\n- **B** knowingly accepts an unbounded surface for convenience.\n- **D** removes all guardrails entirely."},{"id":4,"q":"A senior architect is managing stakeholder expectations for a Claude-based reporting assistant midway through development. Stakeholders have escalating concerns about response latency. Which two actions most directly address stakeholder expectation alignment in this situation? (Select two.)","opts":{"A":"Present measured p50 and p95 latency baselines against the agreed SLA thresholds so stakeholders have accurate data.","B":"Pause all development and reallocate engineering resources entirely to latency optimization.","C":"Communicate that latency concerns are a known LLM limitation and outside the architecture team's control.","D":"Replace the current Claude model with a third-party model that may offer lower latency without evaluation.","E":"Revise the SLA definition collaboratively with stakeholders if current targets are not achievable given production constraints."},"ans":["A","E"],"exp":"Managing stakeholder expectations requires **accurate shared data** and a **realistic, jointly agreed target** rather than deflection.\n- **A** grounds the conversation in evidence by presenting measured **p50 and p95 latency** against the agreed SLA thresholds.\n- **E** realigns expectations honestly by **collaboratively revising the SLA** when original targets are not achievable under production constraints.\n- **B** pauses all work, which is an over-reaction.\n- **C** dismisses latency as an uncontrollable limitation, abandoning the team's responsibility.\n- **D** swaps to an unevaluated third-party model, an unvetted change that does not address expectation alignment."},{"id":5,"q":"You are supporting a team whose Claude Code sessions consistently load 60 or more MCP tools from many servers, exhausting context budget before the session begins. Which adjustment most directly addresses this issue without removing capability?","opts":{"A":"Enable Tool Search so tool definitions are deferred and discovered on demand rather than loaded into context upfront.","B":"Disable every MCP server in the configuration to free up context budget, accepting that the team loses all tool access and cannot perform any MCP-dependent task in the session.","C":"Increase the prompt's verbosity with additional instructions and context, which consumes more of the context budget rather than reducing the tool-definition overhead causing the issue.","D":"Add additional MCP servers to give the team more capability, which increases rather than reduces the number of tool definitions loaded into the session's context budget."},"ans":["A"],"exp":"The problem is **context-budget exhaustion** caused by loading many tool definitions upfront, so the fix must reduce that overhead without losing capability.\n- **A** is correct: enabling **Tool Search** defers tool definitions and discovers them on demand, so schemas are only pulled into context when needed, freeing budget while keeping all tools available.\n- **B** loses capability by disabling servers.\n- **C** adds verbosity, consuming even more of the budget.\n- **D** adds more servers, making the problem worse."},{"id":6,"q":"You are reviewing an integration specification for security gaps. Which two findings constitute valid security gaps in the specification? (Select two.) Each correct answer presents a complete solution.","opts":{"A":"Tool calls execute server-side under a least-privilege service principal scoped to the requested action.","B":"Service credentials are placed in the prompt context, where they can leak into logs and traces.","C":"Role-based access control is enforced only at the response-rendering layer after the model accesses restricted data.","D":"Per-user OAuth tokens are exchanged with scope-restricted permissions and refreshed within the active session.","E":"Tool inputs and outputs are encrypted in transit using transport-layer security between services."},"ans":["B","C"],"exp":"**Security gaps** are places where sensitive data or access controls can be bypassed or exposed.\n- **B** is a gap: putting service **credentials into the prompt context** risks leaking them into logs, traces, and model outputs.\n- **C** is a gap: enforcing **RBAC only at the response-rendering layer** means the model already accessed restricted data before the check, applying authorization too late.\n- **A, D, and E** describe sound practices: server-side least-privilege execution, scope-restricted per-user OAuth tokens, and **TLS** encryption in transit."},{"id":7,"q":"You are investigating an MCP server that fails on first launch but succeeds on subsequent runs. System permission dialogs appeared during the first launch. Which response is most appropriate?","opts":{"A":"Recognize the first-run permission grant as the cause, document the expected behavior in onboarding guidance, and confirm that subsequent runs succeed.","B":"Reinstall the operating system to clear all permission state without first confirming whether the one-time permission grant caused the failure.","C":"Disable operating-system permission dialogs entirely, accept the resulting security implications, and proceed without confirming whether the failure recurs.","D":"Treat the first-run failure as a permanent fault, replace the MCP server, and do not verify whether subsequent runs succeed."},"ans":["A"],"exp":"An MCP server that fails only on first launch while OS permission dialogs appear is exhibiting expected **one-time-grant behavior**, not a defect.\n- **A** is correct: recognize the first-run permission grant as the cause, document it in **onboarding guidance**, and confirm subsequent runs succeed.\n- **B** reinstalls the OS, disproportionate and unverified.\n- **C** disables security dialogs, accepting security risk without diagnosis.\n- **D** permanently replaces the server without confirming the retry works.\n- All alternatives act before diagnosing the **benign root cause**."},{"id":8,"q":"A technical team is cataloguing risks specific to Claude's use in a document-grounded Q&A system. Which two items represent failure modes intrinsic to LLM-based systems rather than generic software defects? (Select two.)","opts":{"A":"An expired TLS certificate blocks outbound API calls to Claude.","B":"A database connection timeout causes retrieval to return an empty result set.","C":"The model refuses a legitimate query because surface features trigger an overly broad safety pattern.","D":"A misconfigured load balancer routes requests to a deprecated API version.","E":"The model generates a plausible-sounding answer unsupported by any retrieved document."},"ans":["C","E"],"exp":"Failure modes **intrinsic to LLM systems** arise from the model's probabilistic language behavior rather than from ordinary infrastructure faults.\n- **C** is intrinsic: a model refusing a legitimate query because surface features trip an **overly broad safety pattern**.\n- **E** is intrinsic: generating a plausible but unsupported answer, i.e. **hallucination**.\n- **A** (expired TLS), **B** (database timeout), and **D** (load-balancer misrouting) are generic software or infrastructure defects that would occur in any system regardless of an LLM."},{"id":9,"q":"You are running a risk assessment on a planned Claude-based deployment and must complete the inventory steps before assessing threats against assets. Which two steps must be completed BEFORE assessing threats against assets to estimate likelihood and impact? (Select two.) Each correct answer presents part of the solution.","opts":{"A":"Document the assessment outcome with risks, mitigations, residual risk, and acceptance owners.","B":"Recommend mitigations and residual-risk acceptance for the risks that remain after analysis.","C":"Identify the assets that the deployment touches, along with the sensitivity of each asset.","D":"Recommend mitigations and residual-risk acceptance for risks that remain.","E":"Enumerate the threat actors and attack vectors relevant to the deployment."},"ans":["C","E"],"exp":"You cannot estimate **likelihood and impact** of threats until you know what you are protecting and who might attack it.\n- **C** is a required inventory step: identify the **assets** the deployment touches and their **sensitivity**.\n- **E** is a required inventory step: enumerate the relevant **threat actors** and **attack vectors**.\n- **A, B, and D** describe documenting outcomes and recommending mitigations, which are downstream activities that happen only after threats have been analyzed."},{"id":10,"q":"You are compiling guardrail tactics for a customer-facing assistant. Which two tactics belong on the guardrail list? Each correct answer presents a complete solution.","opts":{"A":"Embed approved override phrases that let trusted users relax guardrails on demand.","B":"Lower sampling temperature globally to reduce the chance of off-policy completions.","C":"Validate the model output against a structured schema before downstream actions are taken.","D":"Layer prompt-level guardrails with runtime content checks rather than relying on either alone.","E":"Rely on a single hardened system prompt that enumerates every disallowed behavior."},"ans":["C","D"],"exp":"Effective guardrails are **layered** and verify outputs rather than trusting a single mechanism or the model itself.\n- **C** catches malformed or unexpected results at an enforcement point by validating model output against a **structured schema** before any downstream action.\n- **D** provides **defense in depth** by layering prompt-level guardrails with independent runtime content checks, so a failure in one layer is caught by another.\n- **A** creates a **bypass** via approved override phrases.\n- **B** lowers temperature, reducing randomness but not a safety control.\n- **E** relies on a single hardened system prompt, the single-layer approach defense in depth is meant to avoid."},{"id":11,"q":"You are diagnosing a Claude Code session whose subagent uses 50,000 tokens of context before the engineer types a single message. Which root cause is most likely?","opts":{"A":"The developer's keyboard layout or input-method configuration is the cause of the elevated context consumption, introducing extra tokens before the engineer types any message.","B":"Many MCP servers are configured, each contributing tool definitions to the context budget; Tool Search is not enabled, so all definitions load upfront.","C":"The model has internal personal preferences or default behaviors that silently consume large portions of context budget before any user message is processed, independent of tool configuration.","D":"The font rendering or display-scaling settings of the IDE are converting visual output into additional context tokens, causing the high pre-session context consumption."},"ans":["B"],"exp":"The correct answer is **B** because every configured **MCP server** injects its tool definitions into context at session start.\n- **Many MCP servers** can consume tens of thousands of tokens before any user turn.\n- With **Tool Search** not enabled, all definitions load upfront rather than on demand, compounding the cost.\n- **A and D** are wrong: keyboard layouts, font rendering, and display scaling are purely local UI concerns that never enter the token context.\n- **C** is wrong: the model does not carry hidden personal preferences that silently eat context budget."},{"id":12,"q":"A team manager wants all engineers working on the same repository to share identical MCP server definitions without manual synchronization. Which configuration approach satisfies this requirement?","opts":{"A":"managed configuration pushed to all endpoints by the administrator","B":"environment variables set at the operating-system level on each workstation","C":"project-scope .claude/settings.json and .mcp.json files committed to the repository","D":"each engineer maintains a personal ~/.claude/settings.json with the shared definitions"},"ans":["C"],"exp":"The correct answer is **C** because **project-scope** files like `.claude/settings.json` and `.mcp.json` live in the repository itself.\n- Committing them means every engineer who clones or pulls the repo automatically receives **identical MCP definitions** with no manual sync.\n- **A** (managed/administrator-pushed config) is an enterprise control plane not tied to a single repo's shared definitions.\n- **B** (OS-level environment variables) and **D** (per-user `~/.claude` files) both require each engineer to configure their own machine — exactly the manual synchronization to avoid."},{"id":13,"q":"You are supporting an engineer whose Claude Code session reports a permission denial when the engineer expected the action to be allowed. Which resolution step is most appropriate?","opts":{"A":"Tell the engineer to retry the denied action verbatim repeatedly until the denial stops appearing, without inspecting the active permission rules to determine whether the denial is intentional.","B":"Disable the permission system entirely across all scopes to remove the denial, eliminating all tool-pattern and deny-rule controls rather than identifying and amending the specific rule.","C":"Inspect the active permission rules across all scopes — managed, command-line, local, project, and user — to identify which rule is denying the action and confirm whether it should be amended or remain denied.","D":"Grant the engineer unrestricted Bash access to bypass the specific rule causing the denial, removing all tool-pattern constraints rather than amending only the rule in question."},"ans":["C"],"exp":"The correct answer is **C** because Claude Code evaluates permissions across a defined **precedence of scopes** (managed, command-line, local, project, and user), and a denial can originate from any of them.\n- **Inspecting all active rules** identifies exactly which rule fired and whether it is intentional.\n- **A** (blindly retrying) does nothing to change the underlying rule.\n- **B** (disabling the permission system) and **D** (granting unrestricted Bash) remove safety controls wholesale instead of amending only the specific offending rule, violating **least-privilege** practice."},{"id":14,"q":"You are integrating Claude Code into the team's pull-request workflow. The team wants AI-assisted review without removing human approval. Which integration design best fits this requirement?","opts":{"A":"Claude Code reviews the pull request and posts a structured analysis as a comment, while a human reviewer retains the approval decision under the existing branch-protection rules.","B":"Claude Code merges every pull request automatically after completing its analysis, bypassing human approval and the existing branch-protection rules.","C":"Claude Code disables all existing branch-protection rules to streamline the merge process, removing human approval as a required gate.","D":"Claude Code silently deletes pull requests it assesses as low quality without posting a comment or notifying the author."},"ans":["A"],"exp":"The correct answer is **A** because the goal is AI-assisted review that **preserves human approval**.\n- Claude posts a **structured analysis as a comment** while a human retains the merge decision under existing **branch-protection rules**, keeping a human in the loop as the required gate.\n- **B** (auto-merging) and **C** (disabling branch protection) remove that human approval.\n- **D** (silently deleting pull requests) is both destructive and non-transparent, undermining reviewer trust and auditability."},{"id":15,"q":"A platform team operates a self-hosted multi-agent system on Kubernetes that orchestrates seven specialized agents for invoice processing. The team spends approximately 40 percent of engineering capacity on infrastructure maintenance, message bus reliability, and agent state recovery. The CFO has asked you to evaluate moving to managed agent infrastructure to reclaim engineering capacity. The security officer requires that all customer financial data remain within an approved network boundary. Which factor should most heavily influence your recommendation?","opts":{"A":"Whether the current seven agents map cleanly to the patterns supported by managed agents.","B":"Whether managed agents reduce per-invoice token costs across the existing processing volume.","C":"Whether managed agents support the current bus topology used by the platform team.","D":"Whether managed agent data handling satisfies the network boundary required by security."},"ans":["D"],"exp":"The correct answer is **D** because the security officer set a hard constraint that customer financial data must stay within an **approved network boundary**.\n- Any data-handling behavior that violates that boundary is a **disqualifying compliance failure** regardless of cost or capacity savings.\n- **A** (pattern mapping), **B** (token cost), and **C** (bus-topology support) are meaningful engineering considerations but are secondary optimizations.\n- They only matter once the non-negotiable **data-residency** requirement is satisfied."},{"id":16,"q":"You are producing an architecture guide for a new deployment and must complete the planning steps before drafting each section. Which two steps must be completed BEFORE drafting each section of the guide? (Select two.) Each correct answer presents part of the solution.","opts":{"A":"Identify the audience and the questions the guide must answer for that audience.","B":"Translate the guide into the supported regional languages for the candidate population.","C":"Validate the guide with the implementation team and incorporate corrections.","D":"Establish the document under version control with a defined review cadence and approver list.","E":"Outline the guide sections covering the overview, components, contracts, flows, runbooks, and limitations."},"ans":["A","E"],"exp":"The correct answers are **A** and **E** because sound technical writing starts by scoping content before drafting.\n- **A**: Define the **audience** and the questions the guide must answer.\n- **E**: Outline the **section structure** (overview, components, contracts, flows, runbooks, limitations) so drafting has a clear skeleton.\n- **B** (translation), **C** (validation with the implementation team), and **D** (version-control/review cadence) are valuable but are downstream or parallel activities that come after content exists, not prerequisites to drafting."},{"id":17,"type":"yesno","q":"You are evaluating retrieval-strategy claims used by a peer team. For each claim, select yes if the statement is generally accurate. Otherwise, select no.","stmts":[{"s":"Dense vector retrieval is well suited to recovering paraphrased intent against unstructured text.","a":"Yes"},{"s":"Sparse term-matching retrieval recovers exact terms (such as identifiers and rare tokens) more reliably than dense alone.","a":"Yes"},{"s":"Structured query retrieval is the right fit for filter-and-aggregate workloads against a relational store with schema and indexes.","a":"Yes"},{"s":"Hybrid retrieval is identical to dense-only retrieval and shares the same recall characteristics.","a":"No"},{"s":"Random sampling of a data store is a sound retrieval strategy for production Q&A.","a":"No"}],"exp":"- **Dense vector retrieval — Yes**: embeddings capture semantic similarity, so it recovers paraphrased intent over unstructured text well.\n- **Sparse term-matching — Yes**: exact-token methods like **BM25** reliably surface specific identifiers and rare tokens that dense embeddings can blur.\n- **Structured query retrieval — Yes**: filter-and-aggregate workloads over a relational store with schema and indexes are exactly what SQL-style querying is built for.\n- **Hybrid retrieval — No**: hybrid combines dense and sparse signals and therefore has different, typically better, recall than dense-only.\n- **Random sampling — No**: it ignores the query entirely and cannot reliably return relevant answers for production Q&A."},{"id":18,"q":"A Claude-based research assistant begins producing responses that confidently contradict its retrieved source documents despite no change to the retrieval pipeline. Which two diagnostic actions most directly identify the root cause of this behavior? (Select two.)","opts":{"A":"Increase the context-window size to allow more retrieved chunks per query.","B":"Switch the retrieval index to a denser embedding model to improve chunk-relevance scores.","C":"Determine whether the failure reproduces on the previous model version to test for a model mismatch.","D":"Reduce the temperature setting to lower response variance across all query types.","E":"Inspect the system-prompt grounding instructions to determine whether citation constraints remain intact."},"ans":["C","E"],"exp":"The correct answers are **C** and **E** because the behavior changed with **no retrieval-pipeline change**, pointing to the generation side.\n- **C**: Test whether the failure reproduces on the **previous model version** to isolate a model/version mismatch.\n- **E**: Inspect the **system-prompt grounding** and citation constraints to check the instructions that keep answers faithful to sources are intact.\n- **A** (larger context window), **B** (denser embedding model), and **D** (lower temperature) all tune retrieval or sampling variance rather than diagnosing why the model contradicts its sources."},{"id":19,"q":"A solutions architect is analyzing stakeholder feedback collected after the first quarter of a Claude-powered procurement automation deployment. The feedback includes four statements: (1) \"Our procurement team is processing 3x more purchase orders per analyst per day.\" (2) \"We have eliminated the manual data entry role entirely and redeployed those staff to vendor relationship management.\" (3) \"The API integration costs are running 40% over the projected per-transaction budget.\" (4) \"Response latency during end-of-month batch runs is averaging 11 seconds, against our committed 5-second SLA.\" Which of the following correctly identifies the primary business value pillar each stakeholder statement represents?","opts":{"A":"Statement 1: Efficiency; Statement 2: Transformation; Statement 3: Solution Cost; Statement 4: Performance SLA","B":"Statement 1: Productivity; Statement 2: Efficiency; Statement 3: Solution Cost; Statement 4: Performance SLA","C":"Statement 1: Transformation; Statement 2: Productivity; Statement 3: Solution Cost; Statement 4: Efficiency","D":"Statement 1: Efficiency; Statement 2: Productivity; Statement 3: Performance SLA; Statement 4: Solution Cost"},"ans":["A"],"exp":"The correct answer is **A** because each statement maps to the value pillar its metric describes.\n- Statement 1 (3x more purchase orders per analyst per day) is throughput gain — **Efficiency**.\n- Statement 2 (eliminating a role and redeploying staff) is a structural change to how work is done — **Transformation**.\n- Statement 3 (40% over per-transaction budget) is **Solution Cost**.\n- Statement 4 (missing the 5-second latency commitment) is a **Performance SLA** issue.\n- The other options mislabel these — for example calling the role elimination Productivity or swapping the cost and SLA assignments — conflating distinct pillars."},{"id":20,"type":"yesno","q":"You are a solution architect evaluating candidate use cases for a Claude-based program. For each scenario, select Yes if Claude is appropriate as the primary solution at the architectural level. Otherwise, select No.","stmts":[{"s":"drafting first-pass investigative reports from semi-structured incident logs for analyst review","a":"Yes"},{"s":"computing real-time fraud scores at sub-50-millisecond latency on a streaming pipeline","a":"No"},{"s":"long-context contract review with structured clause extraction and deviation flagging","a":"Yes"},{"s":"replacing a vector index for semantic retrieval over a multi-million-document corpus","a":"No"},{"s":"routing inbound support tickets into 30 categories with reasoning for the chosen routing","a":"Yes"}],"exp":"- **First-pass investigative reports from semi-structured logs — Yes**: summarization and drafting for human review play to Claude's language strengths.\n- **Sub-50ms real-time fraud scoring — No**: LLM inference latency cannot meet that streaming budget; a lightweight **ML model** belongs there.\n- **Long-context contract review with clause extraction — Yes**: it needs reasoning over large documents, a core Claude strength.\n- **Replacing a vector index over millions of documents — No**: Claude is the **reasoning layer**, not the retrieval index; pair it with a vector store rather than substituting it.\n- **Routing tickets into 30 categories with reasoning — Yes**: nuanced classification with justification suits an LLM well."},{"id":21,"q":"You are an architect supporting the iteration phase of a deployed Claude-based system. Which activity most directly fits this phase?","opts":{"A":"Rebuild the entire system architecture from scratch at the start of every iteration cycle regardless of what production telemetry, evaluations, and stakeholder feedback indicate is needed.","B":"Stop measuring production outcomes once the deployment has successfully launched, treating the go-live milestone as the end of the evaluation and iteration cycle.","C":"Discard the evaluation framework and reference set once the deployment is in production, accepting that future iterations will have no structured basis for measuring the impact of changes.","D":"Review production telemetry, sampled output evaluations, and stakeholder feedback to identify the highest-impact change for the next cycle, then plan the change against the evaluation framework."},"ans":["D"],"exp":"The **iteration phase** is a continuous improvement loop that consumes evidence from production and feeds it back into planning.\n- **(D) is correct**: review telemetry, sampled output evaluations, and stakeholder feedback to prioritize the single **highest-impact change**, then plan it against a stable evaluation framework so improvement can be measured.\n- **(A)** rebuilding from scratch each cycle discards accumulated learning.\n- **(B)** stopping measurement removes the basis for knowing whether iterations help or harm.\n- **(C)** discarding the evaluation framework and reference set removes that same basis."},{"id":22,"type":"match","q":"You are classifying chunking strategies by the corpus type each is best suited to. For each chunking strategy, select the appropriate corpus type: \"Long Structured Documents,\" \"Heterogeneous Short Records,\" or \"Code or Hierarchical Specifications.\"","choices":["Long Structured Documents","Heterogeneous Short Records","Code or Hierarchical Specs"],"stmts":[{"s":"function-level or section-level chunking for code modules:","a":"Code or Hierarchical Specs"},{"s":"tree-aware chunking that follows code or specification hierarchy:","a":"Code or Hierarchical Specs"},{"s":"per-record chunking where each record is one chunk:","a":"Heterogeneous Short Records"},{"s":"semantic chunking along clause or paragraph boundaries:","a":"Long Structured Documents"},{"s":"fixed-size chunking with overlap for short records of similar length:","a":"Heterogeneous Short Records"},{"s":"hierarchical chunking that mirrors document section structure:","a":"Long Structured Documents"}],"exp":"Chunking strategy should **match the structure of the corpus** so retrieval returns coherent, self-contained units.\n- **Code or Hierarchical Specs**: function-level or section-level chunking and tree-aware chunking both follow the natural boundaries of code and nested specifications.\n- **Heterogeneous Short Records**: per-record chunking (one record per chunk) and fixed-size chunking with overlap for short, similar-length items, where each record is already an **atomic unit**.\n- **Long Structured Documents**: semantic chunking along clause or paragraph boundaries and hierarchical chunking that mirrors document section structure, preserving **section and paragraph organization**."},{"id":23,"type":"yesno","q":"You are evaluating prompting claims in a peer's design document. For each claim, select yes if the claim reflects sound practice. Otherwise, select no.","stmts":[{"s":"Zero-shot is appropriate as a starting point for closed-set classification when categories and descriptions are provided in the prompt.","a":"Yes"},{"s":"Adding a few-shot example set with exact field names anchors output formatting on extraction tasks.","a":"Yes"},{"s":"Chain-of-thought should be the default on every task regardless of complexity.","a":"No"},{"s":"Leading-question framing is best mitigated by asking for an even-handed comparison with stated criteria.","a":"Yes"},{"s":"Behavioral differences across model versions can be ignored once a prompt has been validated on one version.","a":"No"}],"exp":"- **Zero-shot** is a reasonable starting point for closed-set classification when categories and descriptions are given in the prompt (**Yes**).\n- **Few-shot** examples using exact field names anchor output formatting on extraction tasks (**Yes**).\n- **Chain-of-thought** as a default on every task is not sound (**No**): it adds latency and cost and can hurt on simple tasks; apply it only where reasoning genuinely helps.\n- Mitigating leading-question bias by requesting an **even-handed comparison** against stated criteria is good practice (**Yes**).\n- Ignoring **behavioral differences across model versions** after validating on one version is wrong (**No**): a new version can change behavior, so prompts should be re-evaluated per version."},{"id":24,"q":"You are assessing a Claude-based system whose dominant risk is silent quality drift on safety-relevant outputs after a model-version upgrade. Which assessment activity most directly addresses this risk?","opts":{"A":"Disable adversarial evaluation entirely during model-version upgrade cycles to reduce evaluation cost, accepting that safety drift will go undetected until it appears in production.","B":"Rotate adversarial inputs randomly so no two upgrades are scored on the same set.","C":"Skip evaluation on each model-version upgrade and rely on user-submitted complaints to surface safety drift after the upgraded model has already served production traffic.","D":"Maintain an adversarial evaluation set with version-attributed scoring so each upgrade is measured against the same set before promotion."},"ans":["D"],"exp":"**Silent quality drift** on safety-relevant outputs is only catchable if every upgrade is scored the same way before it reaches users.\n- **(D) is correct**: maintain a fixed adversarial evaluation set with **version-attributed scoring** so each upgrade is measured against the identical set and gated before promotion.\n- **(A)** disabling adversarial evaluation and **(C)** relying on user complaints both let drift reach production undetected.\n- **(B)** randomly rotating inputs so no two upgrades share a set destroys **comparability**, making version-over-version drift impossible to detect."},{"id":25,"q":"You are responding to an adversarial input pattern in which users include text claiming admin authority and instructing the model to bypass safety restrictions. Which combination of controls most effectively mitigates this attack pattern?","opts":{"A":"Trusting that the model will intrinsically recognize and reject all bypass attempts without prompt-level instructions, runtime classifiers, scoped permissions, or audit logging.","B":"Prompt-level instructions that treat user content as untrusted data, runtime classifiers that detect override attempts, scoped tool permissions that cannot be elevated by user content, and audit logging of attempts.","C":"Removing all safety restrictions and guardrails to eliminate the attack surface that bypass attempts target, accepting that this makes the assistant unrestricted for all inputs.","D":"Granting users any privilege level they assert in their message content, on the assumption that cooperative behavior requires honoring self-declared authority without independent verification."},"ans":["B"],"exp":"Injected claims of admin authority are a form of **prompt injection**, and the robust defense is **layered** rather than any single control.\n- **(B) is correct**: treat all user content as **untrusted data** at the prompt level, use runtime classifiers to detect override attempts, scope tool permissions so they cannot be elevated by user content, and log attempts for audit.\n- **(A)** trusting the model to intrinsically reject everything has no enforcement.\n- **(C)** removing all guardrails defeats the purpose of safety.\n- **(D)** honoring self-declared authority is exactly the vulnerability being exploited."},{"id":26,"q":"An operations engineer reports that a Claude-based pipeline began returning malformed JSON responses after a scheduled maintenance window, causing downstream processing failures. Which two investigative steps most directly isolate the root cause? (Select two.)","opts":{"A":"Clear the prompt cache and resubmit all pending requests to eliminate stale cached prefixes.","B":"Compare the current system prompt and output schema configuration against the last known good version from before the maintenance window.","C":"Switch to a different Claude model tier to rule out provider-side changes as a contributing factor.","D":"Increase the max_tokens limit to determine whether output truncation is causing incomplete JSON structures.","E":"Replay a set of pre-maintenance requests against the current configuration and inspect the raw model output before downstream parsing."},"ans":["B","E"],"exp":"Because the failure began right after a maintenance window and produces malformed JSON, isolate the cause by **checking what changed** and **observing raw model output** directly.\n- **(B) is correct**: compare the current system prompt and output schema against the last known good pre-maintenance version to surface **configuration changes** introduced during the window.\n- **(E) is correct**: replay pre-maintenance requests against the current configuration and inspect **raw output before parsing** to isolate a model regression from a downstream parsing issue.\n- **(A)** clearing the cache, **(C)** switching model tier, and **(D)** raising max_tokens are speculative fixes that change variables without first identifying the regression."},{"id":27,"q":"Engineering leadership wants to roll out Claude Skills to 280 developers across 14 teams. Skills will encode internal coding standards, code-review checklists, and incident-postmortem templates. Leadership has asked how to govern Skill authorship so that Skills remain trustworthy without bottlenecking on a single central team. Which governance model should you recommend?","opts":{"A":"Per-developer authorship across the 280 engineers with no team-level coordination required.","B":"Centralized authorship by a single platform team responsible for every Skill produced.","C":"Fully decentralized authorship across the 14 teams with no review before publication.","D":"Federated authorship across the 14 teams with a central review and publication gate."},"ans":["D"],"exp":"With 280 developers across 14 teams, the goal is to keep Skills **trustworthy** while avoiding a **single-team bottleneck**.\n- **(D) is correct**: a **federated model** lets each team author Skills relevant to its domain while a central review-and-publication gate enforces consistent quality and trust before sharing.\n- **(B)** centralized authorship by one platform team creates the bottleneck to avoid.\n- **(A)** per-developer and **(C)** fully decentralized authorship with no review sacrifice the trust and consistency needed for shared standards and templates."},{"id":28,"q":"You are transitioning a Claude-based deployment from design into implementation. Which handoff package most directly supports a clean transition?","opts":{"A":"The most recent set of design presentation slides without component-level diagrams, interface contracts, an evaluation framework with a reference set, runbooks, or a known-limitations register.","B":"A verbal walkthrough conducted on the day of handoff with no written architecture overview, ADRs, component contracts, evaluation framework, runbooks, playbook, or known limitations.","C":"Architecture overview, ADRs, component contracts, evaluation framework with reference set, runbooks, on-call playbook, and known limitations.","D":"Source code alone with no integrating architecture overview, ADRs, component contracts, evaluation framework, runbooks, on-call playbook, or known-limitations register to support the delivery team."},"ans":["C"],"exp":"A clean **design-to-implementation handoff** gives the delivery team everything needed to build, evaluate, operate, and understand the system's boundaries.\n- **(C) is correct**: an architecture overview, **ADRs**, component contracts, an evaluation framework with reference set, runbooks, an on-call playbook, and a **known-limitations register**.\n- **(A)** slides without diagrams or contracts, **(B)** a verbal-only walkthrough with nothing written, and **(D)** source code alone with no integrating documentation all leave the team without the decisions, interfaces, or operational guidance required."},{"id":29,"q":"A security audit uncovers two issues: (1) all end users share a single API key, and (2) tool calls are executed without logging the initiating user. Which two mitigations directly address these specific findings? (Select two.)","opts":{"A":"Validate structured outputs against a schema before downstream actions are executed.","B":"Enforce RBAC at the retrieval layer before content enters the model context.","C":"Move credentials out of the prompt context and resolve them from a server-side secret store.","D":"Add actor attribution to tool-call logs so each call records the initiating user identity.","E":"Replace the shared API key with per-user OAuth tokens carrying scope-restricted permissions."},"ans":["D","E"],"exp":"The two findings are a **shared API key** and tool calls with no record of who initiated them, so the mitigations must address **identity and attribution** directly.\n- **(E) is correct**: replace the shared key with **per-user OAuth tokens** carrying scope-restricted permissions, fixing the shared-credential problem and enabling per-user accountability and least privilege.\n- **(D) is correct**: add **actor attribution** to tool-call logs so each call records the initiating user, fixing the missing audit trail.\n- **(A)** schema validation, **(B)** retrieval-layer RBAC, and **(C)** moving credentials to a secret store are sound practices but do not target these two specific findings."},{"id":30,"q":"An architect is reviewing a Claude-based candidate-screening tool prior to deployment. A stakeholder asserts that because the model was not trained on company data, no bias evaluation is necessary. Which two responses most accurately challenge this assertion? (Select two.)","opts":{"A":"Transparency obligations are satisfied by disclosing that an AI system is in use, without further evaluation.","B":"Fairness testing is required only when the training dataset is known to contain protected-class labels.","C":"The model may carry demographic biases from pretraining that manifest in screening outcomes regardless of fine-tuning.","D":"The system should be evaluated on outcome-disparity metrics across protected groups before deployment.","E":"Bias evaluation is unnecessary when the model provider has published a responsible-use policy."},"ans":["C","D"],"exp":"The assertion is flawed because a model not fine-tuned on company data can still inherit biases, and fairness must be **measured empirically**.\n- **(C) is correct**: the model may carry **demographic biases from pretraining** that manifest in screening outcomes regardless of fine-tuning.\n- **(D) is correct**: evaluate the system on **outcome-disparity metrics** across protected groups before deployment, rather than assuming bias is absent.\n- **(A)** mere disclosure does not satisfy fairness obligations, **(B)** fairness testing is not conditional on training data containing protected labels, and **(E)** a provider's responsible-use policy does not substitute for evaluating your own deployed outcomes."},{"id":31,"q":"You are distinguishing functional from non-functional requirements during discovery. Which item is a non-functional requirement?","opts":{"A":"The system must extract a defined set of specific fields from invoice attachments and populate a downstream data record.","B":"The system must produce a draft response that a human reviewer can edit before sending.","C":"The system must classify inbound tickets into a defined set of categories.","D":"The system must respond at p95 latency under 800 milliseconds at the expected request volume."},"ans":["D"],"exp":"**Non-functional requirements** describe *how well* the system must perform rather than *what* task it performs.\n- **Option D** specifies a **p95 latency** target under a given load, a **quality-of-service (performance)** constraint rather than a feature.\n- **A, B, and C** all describe **functional behaviors**: extracting fields, producing an editable draft, and classifying tickets are things the system *does*, not quality attributes it must satisfy."},{"id":32,"type":"match","q":"You are sequencing decomposed components in an invoice-processing pipeline. For each of the decomposed components, select the execution layer it belongs to: \"Pre-Processing,\" \"Model Stage,\" or \"Post-Processing.\"","choices":["Pre-Processing","Model Stage","Post-Processing"],"stmts":[{"s":"Claude-based classification of invoice type:","a":"Model Stage"},{"s":"persistence of validated records to the system of record:","a":"Post-Processing"},{"s":"schema validation of the extracted fields:","a":"Post-Processing"},{"s":"Claude-based extraction of structured invoice fields:","a":"Model Stage"},{"s":"PII redaction on extracted text prior to model invocation:","a":"Pre-Processing"},{"s":"optical character recognition on scanned invoice images:","a":"Pre-Processing"}],"exp":"The key principle is **sequencing relative to the model call**: transform inputs first, invoke the model, then validate and persist results.\n- **Pre-Processing**: OCR and PII redaction happen **before** the model is invoked, transforming raw input into model-ready text.\n- **Model Stage**: Claude-based classification and Claude-based extraction are the actual **LLM inference calls**.\n- **Post-Processing**: schema validation of extracted fields and persistence of validated records occur **after** inference to verify and store the model's output."},{"id":33,"q":"A pilot AI assistant for procurement specialists shows 89 percent first-response acceptance, but follow-up surveys reveal that specialists frequently override the assistant's vendor recommendations after considering criteria the assistant did not evaluate. The pilot owner wants to ship the assistant unchanged because of the strong acceptance rate. Which two Discernment-competency observations should you raise BEFORE approving the launch? (Select two.)","opts":{"A":"The acceptance rate alone proves readiness for general production use.","B":"The survey response rate may not be statistically representative of all specialists.","C":"The unconsidered criteria represent a scope gap in the assistant's input space.","D":"Acceptance does not establish whether recommendations remain correct after specialist review.","E":"The pilot duration was probably too short to demonstrate reliability across the full year."},"ans":["C","D"],"exp":"A high first-response **acceptance rate** measures whether users initially accept an output, not whether it is actually **correct or complete**.\n- **Option D**: acceptance is not a proxy for **correctness**, especially since specialists later override recommendations after deeper review.\n- **Option C**: the criteria the assistant never evaluates constitute a genuine **scope gap in its input space**, so it lacks information needed for sound recommendations.\n- **A** is wrong because it overstates what acceptance proves; **B and E** raise legitimate but **secondary methodological** points, not the core Discernment concerns exposed by the override pattern."},{"id":34,"q":"A revenue projection assistant has missed its monthly cost target by 38 percent. Profiling shows three contributors: a 6,000-token policy preamble repeated on every call (45 percent of cost), retrieval of historical sales chunks averaging 3,000 tokens per call (30 percent), and inference on a flagship-tier model (25 percent). Stakeholders require that projection accuracy remain unchanged. Which two optimizations should you sequence first to reduce cost without affecting accuracy? (Select two.) Each correct answer presents part of the solution.","opts":{"A":"Reduce the number of historical sales chunks retrieved across each query run.","B":"Truncate the policy preamble to remove non-essential clauses from the prompt.","C":"Enable prompt caching on the static policy preamble across the recurring calls.","D":"Switch the workload to a smaller, faster Claude model tier across all queries.","E":"Cache common retrieved sales chunks accessed across many of the daily queries."},"ans":["C","E"],"exp":"The constraint is to cut cost **without changing accuracy**, so the safe optimizations remove **redundant token processing** rather than altering what the model sees or which model runs.\n- **Option C**: **prompt caching** on the static 6,000-token policy preamble so the repeated prefix is not reprocessed at full cost on every call.\n- **Option E**: cache commonly retrieved **sales chunks** to avoid re-fetching and re-billing identical context.\n- Both preserve the **exact inputs and model**, so accuracy is unaffected.\n- **A and B** reduce the content the model receives (fewer chunks or a truncated preamble), and **D** swaps to a smaller model — all risk changing accuracy and violate the constraint."},{"id":35,"q":"A technical team is debating whether to implement a new capability for generating regulatory filings from internal data as a Claude Skill or as an MCP server. The capability requires a fixed authoring procedure with embedded examples, does not need to call live external systems, and must be portable across three Claude deployments: claude.ai, an internal API integration, and Claude Code. Which factor most strongly favors implementing the capability as a Skill?","opts":{"A":"The capability needs to query a live database for the most recent regulatory filings.","B":"The capability must also be callable from a developer's command-line interface.","C":"The capability requires direct authentication against the corporate identity provider.","D":"The capability is procedural knowledge with no live external-system calls required."},"ans":["D"],"exp":"A **Skill** packages procedural knowledge, fixed instructions, and embedded examples that Claude loads and follows, and it is **portable** across claude.ai, API integrations, and Claude Code.\n- **Option D** matches exactly: the capability is a defined authoring procedure needing **no live external-system calls**.\n- **MCP servers** are the right choice when connecting to live systems, databases, or authenticated services, so **A and C** actually argue *against* a Skill.\n- **B** (command-line callability) is satisfied by a Skill anyway and is not the deciding factor."},{"id":36,"type":"yesno","q":"You are auditing a procurement-assistant agent whose defined responsibility is to draft purchase requests for review. For each tool currently configured on the agent, select yes if the tool should remain after a least-privilege audit. Otherwise, select no if it should be removed.","stmts":[{"s":"a read-only catalog lookup tool that returns vendor and SKU information","a":"Yes"},{"s":"an inbox-send tool that emails purchase requests to vendors directly","a":"No"},{"s":"a draft-write tool that creates purchase-request drafts in the review queue","a":"Yes"},{"s":"a production-database admin tool unrelated to procurement","a":"No"},{"s":"A read-only policy-document tool that returns the relevant procurement policies","a":"Yes"}],"exp":"**Least-privilege** means retaining only the tools required to **draft purchase requests for review**.\n- **Keep**: the read-only catalog lookup, the draft-write tool that creates drafts in the review queue, and the read-only policy-document tool — all directly support drafting.\n- **Remove**: the **inbox-send tool** that emails vendors directly exceeds the draft-for-review scope and could send unreviewed requests.\n- **Remove**: the **production-database admin tool** is unrelated to procurement and grants broad, unnecessary privilege."},{"id":37,"type":"yesno","q":"You are evaluating model-selection claims used by a peer team. For each statement, select yes if the statement is generally true. Otherwise, select no.","stmts":[{"s":"Heavier-reasoning models typically consume more of the rate limit and run more slowly than lighter models on the same input.","a":"Yes"},{"s":"A representative-sample evaluation on the target workload is the right basis for confirming a model selection.","a":"Yes"},{"s":"The most capable model is always the right choice regardless of the workload profile.","a":"No"},{"s":"Tiered routing can serve routine traffic with a lighter model while reserving a heavier model for traffic that needs its capability.","a":"Yes"},{"s":"Selecting a model based on which version was most recently announced is the right basis for production decisions.","a":"No"}],"exp":"The verdicts turn on **evidence-based, workload-fit** reasoning.\n- **True**: heavier-reasoning models do more computation, so they run **slower** and consume more of the rate/token budget on the same input.\n- **True**: confirming a choice with a **representative-sample evaluation** on the actual target workload is sound practice.\n- **True**: **tiered routing** that sends routine traffic to a lighter model while reserving a heavier model for demanding traffic is a valid cost/capability strategy.\n- **False**: claiming the **most capable model is always right** ignores cost, latency, and workload fit.\n- **False**: choosing a model merely because it was **most recently announced** is not an evidence-based production decision."},{"id":38,"q":"The engineering lead at Trenova Systems, Inc. is evaluating two proposals for improving developer workflows using Claude-assisted tooling. Proposal A adds Claude Code to the IDE for inline code generation and review. Proposal B routes all code-generation requests through a shared Slack bot without IDE integration. Which two observations most accurately evaluate these proposals against workflow-improvement objectives? (Select two.)","opts":{"A":"Proposal B is superior because centralizing requests in Slack creates an auditable log of all code-generation activity.","B":"Proposal B introduces workflow friction by requiring developers to leave the IDE, undermining the productivity objective.","C":"Proposal A reduces context switching by providing AI assistance at the point of development without requiring a separate tool.","D":"Proposal B improves workflow velocity because Slack notifications create an asynchronous review queue.","E":"Both proposals are equivalent because the model capabilities are identical regardless of the integration point."},"ans":["B","C"],"exp":"The objective is to **improve developer workflow**, best served by minimizing **friction and context switching**.\n- **Option C**: Claude Code in the IDE delivers assistance **at the point of development**, avoiding tool-switching.\n- **Option B**: routing requests through a **Slack bot** forces developers out of the IDE, adding friction that undermines productivity.\n- **A and D** overstate incidental Slack benefits (audit logs, async queues) that do not address the core workflow goal.\n- **E** is wrong because the **integration point** materially affects developer experience even when model capabilities are identical."},{"id":39,"q":"A document analysis service processes legal filings averaging 80,000 tokens each. Each filing is queried by attorneys an average of 14 times during a case. The current architecture sends the full filing on every query. The CFO has asked you to reduce per-query costs while preserving response quality. The security officer requires that filing contents not be stored outside Fabrikam's tenancy. Which optimization approach should you recommend?","opts":{"A":"Summarize each filing once at intake and run all subsequent queries against the summary.","B":"Cache the filing as the prompt prefix for reuse across the 14 queries per case.","C":"Index filings in a vector store and retrieve only the relevant passages per query.","D":"Move the workload to a smaller Claude model to reduce the per-token cost paid."},"ans":["B"],"exp":"The same 80,000-token filing is queried **14 times**, so **Option B** — caching it as a **prompt prefix** — lets repeated queries reuse the cached context at reduced cost while the model still sees the **full filing** (preserving quality), and prompt caching operates **within the tenancy** without exporting contents.\n- **A** (summarizing) loses detail and degrades response quality.\n- **C** (vector store) risks storing filing contents **outside tenancy** and returns only partial passages, hurting quality.\n- **D** (smaller model) lowers per-token cost but can reduce answer quality.\n- Only **B** cuts per-query cost while preserving both **quality** and the **data-residency** requirement."},{"id":40,"q":"You are designing a test strategy for a Claude-based pipeline that handles sensitive financial data. Which two test types should be prioritized to cover both safety under attack and cross-component correctness? (Select two.)","opts":{"A":"Adversarial tests using prompt-injection and malformed-input cases.","B":"Regression tests against a stable reference set of previously known-good outputs.","C":"Smoke tests that verify core paths after each deployment.","D":"Integration tests that verify end-to-end pipeline behavior across all components.","E":"Unit tests targeting only individual prompt-template rendering logic."},"ans":["A","D"],"exp":"The two goals are **safety under attack** and **cross-component correctness**, so the priorities map to each.\n- **Option A**: **adversarial testing** with prompt-injection and malformed inputs directly probes safety when the system is attacked — critical for sensitive financial data.\n- **Option D**: **integration testing** verifies end-to-end behavior across all components, covering cross-component correctness.\n- **B, C, and E** (regression, smoke, unit tests) are valuable but each addresses **narrower concerns** and does not target adversarial safety or full pipeline integration."},{"id":41,"q":"The platform team at Trenova Systems, Inc. needs to reduce per-query cost and p95 latency for a high-volume Claude pipeline without degrading output quality on the core use case. Which two optimizations directly target both cost and latency simultaneously? (Select two.)","opts":{"A":"Enable prompt caching on the static system-prompt prefix to reduce billable input tokens on repeated calls.","B":"Route straightforward query types to a smaller, faster Claude model and reserve the full model for complex cases.","C":"Increase max_tokens to reduce the frequency of truncated responses requiring follow-up calls.","D":"Add a retrieval step that fetches the full source corpus into the context window before generation.","E":"Expand the system prompt to include additional few-shot examples on every request."},"ans":["A","B"],"exp":"Both winning options cut **cost and latency** together without hurting core quality.\n- **A** — **Prompt caching** on a static system-prompt prefix lets Claude skip reprocessing repeated tokens, so repeated calls bill fewer input tokens and start generating sooner.\n- **B** — **Routing** simple queries to a smaller, faster model while reserving the full model for hard cases reduces spend and time-to-first-token for the bulk of traffic.\n- **C** and **E** increase token volume and latency (higher max_tokens, more few-shot examples).\n- **D** inflates input tokens and slows generation by pulling the full corpus into context."},{"id":42,"q":"You are evaluating a Claude-based deployment for adherence to a specific regulation. Which two steps must be completed BEFORE mapping deployment data flows to specific regulatory clauses? (Select two.) Each correct answer presents part of the solution.","opts":{"A":"Compare the in-place controls against the regulatory requirements to identify any compliance gaps.","B":"Identify the applicability of the regulation based on data types, jurisdiction, and audience.","C":"Schedule the remediation work with the engineering team based on the prioritized gap findings.","D":"Document the identified gaps along with recommended remediations and residual risk for signoff.","E":"Inventory the vendor-provided compliance tooling and confirm which compliance affordances are in place."},"ans":["B","E"],"exp":"Two prerequisites must come before mapping data flows to specific clauses.\n- **B** — Establish that the regulation even **applies**, based on data types processed, jurisdiction, and audience.\n- **E** — Inventory the **vendor-provided compliance affordances** so you know which controls are in place before assessing them.\n- **A** (comparing controls to requirements), **D** (documenting gaps), and **C** (scheduling remediation) are downstream steps that occur after applicability and the control inventory are established."},{"id":43,"q":"A research summarization assistant has been deployed for six months. A user has flagged that a generated summary contained a fabricated citation. The product team has asked whether the incident requires architectural action or whether it is an isolated case. Which two Diligence-competency actions should you take? (Select two.) Each correct answer presents part of the solution.","opts":{"A":"Sample recent summaries to estimate the fabrication frequency across the population.","B":"Disable the assistant immediately for all current users without any prior diagnostic analysis.","C":"Review whether citation-grounding controls exist anywhere in the current generation pipeline.","D":"Communicate to users that the assistant does not fabricate output as a matter of design.","E":"Treat the incident as an anecdotal isolated case and take no further investigative action."},"ans":["A","C"],"exp":"Sound **diligence** treats a single fabricated citation as a signal to investigate, not to ignore or overreact to.\n- **A** — **Sample recent summaries** to estimate how often fabrication actually occurs across the population rather than guessing.\n- **C** — Review whether any **citation-grounding controls** exist in the pipeline to determine if this is a systemic gap or a rare miss.\n- **B** (disabling with no diagnosis) is disproportionate.\n- **D** (claiming it never fabricates by design) is false, since LLMs can hallucinate.\n- **E** (dismissing it as isolated with no investigation) abandons the diligence responsibility."},{"id":44,"q":"A security team is evaluating two proposed controls. Control A adds an outbound tool allowlist with destination restrictions and per-call review. Control B scores responses against a stable adversarial evaluation set after each model-version change. Which two risk categories are correctly matched to these controls? (Select two.)","opts":{"A":"Control A - prompt injection from adversarial content in retrieved data","B":"Control A - silent quality drift after a model-version upgrade","C":"Control A - data exfiltration via outbound tool calls","D":"Control B - data exfiltration via outbound tool calls","E":"Control B - silent quality drift after a model-version upgrade"},"ans":["C","E"],"exp":"Each control maps to the risk it actually mitigates.\n- **C** — Control A's outbound **allowlist**, destination limits, and per-call review prevent a manipulated agent from sending data to unauthorized endpoints, matching **data exfiltration via outbound tool calls**.\n- **E** — Control B's repeated scoring against a stable **adversarial evaluation set** after each model-version change is precisely how you catch **silent quality drift** from an upgrade.\n- The other pairings are mismatched: Control A does not address prompt injection or drift, and Control B does not constrain outbound network destinations."},{"id":45,"q":"You are selecting a model for a new production workload and must complete the upstream steps before testing candidate models empirically. Which two steps must be completed BEFORE running a representative sample on a candidate model? (Select two.) Each correct answer presents part of the solution.","opts":{"A":"Select the lightest model that consistently meets the quality bar across the sample.","B":"Retest the model choice when a new model version becomes available.","C":"Choose a candidate model based on the requirements profile and known capabilities.","D":"Define the quality bar, latency tolerance, and expected volume for the workload.","E":"Sign off the production rollout plan with the platform and security teams."},"ans":["C","D"],"exp":"Two upstream steps must precede running a representative sample on a candidate model.\n- **D** — Define the **quality bar, latency tolerance, and expected volume** so you know what you are testing against.\n- **C** — Choose a **candidate model** based on that requirements profile and the models' known capabilities, giving you something concrete to test.\n- **A** (selecting the lightest passing model), **B** (retesting on new versions), and **E** (signing off the rollout) all depend on test results and come after the sample run."},{"id":46,"q":"You are preparing an operational runbook for a Claude-based service. Which content is essential to include in the runbook?","opts":{"A":"Dashboard and log references only, without alert definitions, triage steps, escalation paths, or rollback procedures for the on-call engineer to act on.","B":"Common alerts and their triage steps, escalation paths, rollback procedures, and references to the relevant dashboards and logs.","C":"Alert definitions and triage steps only, without escalation paths, rollback procedures, or references to dashboards and logs for on-call use.","D":"Escalation paths and rollback procedures only, without alert definitions, triage steps, or dashboard references to guide initial incident response."},"ans":["B"],"exp":"An effective **operational runbook** must give the on-call engineer everything needed to act.\n- **B** is correct: common **alerts with triage steps**, **escalation paths**, **rollback procedures**, and links to relevant dashboards and logs.\n- The other options each omit essential pieces (triage steps, escalation paths, or rollback procedures), which would strand the responder mid-incident.\n- A runbook that only points to dashboards without explaining how to interpret alerts or recover is not actionable under pressure."},{"id":47,"q":"You are designing a feedback session for a deployment in flight. Which structure best supports productive stakeholder feedback?","opts":{"A":"Hold an open-ended meeting with no pre-distributed agenda or artifacts, and rely on participants' memory to carry decisions and follow-up owners forward.","B":"Define a focused agenda, share the artifacts in advance, capture decisions and follow-ups in writing, and confirm action owners and dates.","C":"Distribute artifacts at the session start rather than in advance, so stakeholders review materials in real time without preparation before the discussion begins.","D":"End the session without recording decisions, follow-up items, action owners, or dates, relying on participant memory to carry the session's outcomes forward."},"ans":["B"],"exp":"Productive stakeholder feedback depends on **preparation** and **durable records**.\n- **B** is correct: a focused agenda, artifacts shared **in advance**, written decisions and follow-ups, and confirmed **owners and dates**.\n- **A** (no agenda or artifacts) and **C** (artifacts distributed only at the start) force real-time review and reduce input quality.\n- **D** (ending without recording decisions and owners) relies on memory and predictably loses accountability and follow-through."},{"id":48,"q":"You are integrating AI-assisted tooling into the team's documentation workflow. The team wants generated documentation that stays grounded in the actual code. Which integration approach best fits this requirement?","opts":{"A":"Generate documentation from the model's training-data recall without reading any of the actual repository code, accepting that the output will not reflect the current implementation.","B":"Have the subagents publish generated documentation directly to the public-facing site without passing through the team's normal review workflow or any human approval step.","C":"Configure subagents that read the relevant code files via filesystem and code-search tools, generate the documentation, and emit changes through the team's normal review workflow.","D":"Disable all filesystem and code-search tools so the subagents cannot read any repository code, accepting that documentation generation will be entirely disconnected from the actua
